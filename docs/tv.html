<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Interslice Systems — TV Service Bay</title>
<style>
/* ============================================================
   TV Service Bay — late-70s woodgrain console television.
   Dev/tuning page: fixed dark workshop backdrop, no tokens.css,
   no theme participation. Exact pixels matter (640×480 screen);
   the page scrolls rather than shrinks.
   ============================================================ */

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  min-width: fit-content;
  min-height: 100vh;
  background:
    radial-gradient(1400px 900px at 50% 14%, #1e2127 0%, #16181d 55%, #101217 100%)
    #16181d;
  color: #9aa1ad;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
}

.bay {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: max-content;
  margin: 0 auto;
  padding: 44px 40px 80px;
}

.bay-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .34em;
  text-transform: uppercase;
  color: #565e6b;
  margin: 0 0 36px;
  user-select: none;
}

/* ---- Cabinet ------------------------------------------------ */

.tv-cabinet {
  position: relative;
  width: max-content;
  border-radius: 16px;
  /* room for legs + floor shadow before the bench */
  margin-bottom: 96px;
  box-shadow:
    0 30px 55px -16px rgba(0, 0, 0, .85),
    0 10px 24px rgba(0, 0, 0, .4);
}

svg.cab-wood {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: inherit;
  display: block;
}

.cab-sheen {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  z-index: 1;
  background:
    linear-gradient(180deg,
      rgba(255, 244, 220, .16) 0,
      rgba(255, 244, 220, .04) 22px,
      rgba(255, 255, 255, 0) 90px,
      rgba(0, 0, 0, .10) 70%,
      rgba(0, 0, 0, .30) 100%),
    linear-gradient(90deg,
      rgba(0, 0, 0, .28) 0,
      rgba(0, 0, 0, 0) 26px,
      rgba(0, 0, 0, 0) calc(100% - 26px),
      rgba(0, 0, 0, .28) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 240, 210, .30),
    inset 0 -3px 6px rgba(0, 0, 0, .55),
    inset 2px 0 3px rgba(255, 240, 210, .07),
    inset -2px 0 4px rgba(0, 0, 0, .35);
}

/* routed groove around the face frame */
.cab-groove {
  position: absolute;
  inset: 13px;
  border-radius: 9px;
  pointer-events: none;
  z-index: 1;
  border: 1px solid rgba(20, 10, 4, .55);
  box-shadow:
    0 1px 0 rgba(255, 230, 190, .12),
    inset 0 1px 0 rgba(255, 230, 190, .10);
}

.cab-inner {
  position: relative;
  z-index: 2;
  display: flex;
  gap: 20px;
  padding: 26px;
}

/* ---- Screen zone -------------------------------------------- */

.screen-zone {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.bezel {
  position: relative;
  padding: 26px;
  border-radius: 18px;
  background:
    linear-gradient(180deg, #2a2724 0%, #161412 30%, #0e0d0b 75%, #090807 100%);
  box-shadow:
    inset 0 1px 1px rgba(255, 255, 255, .12),
    inset 0 -2px 6px rgba(0, 0, 0, .7),
    0 0 0 1px rgba(8, 5, 3, .9),
    0 0 0 3px rgba(60, 36, 18, .55),
    0 3px 8px rgba(0, 0, 0, .55);
}

.bezel-text {
  position: absolute;
  left: 50%;
  bottom: 5px;
  transform: translateX(-50%);
  font-size: 8px;
  font-weight: 600;
  letter-spacing: .32em;
  text-transform: uppercase;
  color: #b3a98c;
  text-shadow: 0 -1px 0 rgba(0, 0, 0, .8);
  user-select: none;
  white-space: nowrap;
}

.screen-cutout {
  position: relative;
  width: 640px;
  height: 480px;
  border-radius: 28px;
  overflow: hidden;
  background: #050607;
}

#crt, #bypass {
  position: absolute;
  left: 0;
  top: 0;
  width: 640px;   /* renderer manages backing-store size itself */
  height: 480px;
}
#bypass { image-rendering: pixelated; } /* keep the nearest-neighbor look on HiDPI */
#crt[hidden], #bypass[hidden] { display: none; }

/* glass: inset shadow + faint diagonal glint, painted over the canvases */
.screen-cutout::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(160deg,
    rgba(255, 255, 255, .055) 0%,
    rgba(255, 255, 255, .015) 18%,
    rgba(255, 255, 255, 0) 34%);
  box-shadow:
    inset 0 0 46px 10px rgba(0, 0, 0, .60),
    inset 0 0 6px 2px rgba(0, 0, 0, .75),
    inset 0 2px 10px rgba(0, 0, 0, .45);
}

/* ---- Speaker grille ------------------------------------------ */

.grille {
  position: relative;
  height: 86px;
  border-radius: 10px;
  /* walnut slats over dark cloth */
  background:
    repeating-linear-gradient(90deg,
      #4c2f1a 0px,
      #6a472a 3px,
      #573620 6px,
      #2e1b0e 8px,
      rgba(0, 0, 0, 0) 8px,
      rgba(0, 0, 0, 0) 16px),
    repeating-linear-gradient(0deg,
      rgba(0, 0, 0, .35) 0 1px,
      rgba(255, 255, 255, .02) 1px 3px),
    #15100b;
  box-shadow:
    inset 0 3px 8px rgba(0, 0, 0, .8),
    inset 0 -2px 5px rgba(0, 0, 0, .6),
    0 1px 0 rgba(255, 230, 190, .08);
}

.grille::after { /* top/bottom slat shading */
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(180deg,
    rgba(0, 0, 0, .45) 0%,
    rgba(0, 0, 0, 0) 22%,
    rgba(0, 0, 0, 0) 76%,
    rgba(0, 0, 0, .5) 100%);
}

.grille .badge { /* scoped: the bench reuses .badge for its scope pills */
  position: absolute;
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 1;
  padding: 4px 12px 3px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .3em;
  text-indent: .3em; /* balance letter-spacing */
  color: #332b20;
  background: linear-gradient(180deg, #ded9cd 0%, #b3aea0 48%, #cfcaba 52%, #9a9486 100%);
  border-radius: 3px;
  box-shadow:
    0 1px 2px rgba(0, 0, 0, .8),
    inset 0 1px 0 rgba(255, 255, 255, .7),
    inset 0 -1px 1px rgba(0, 0, 0, .35);
  user-select: none;
}

/* ---- Control plate ------------------------------------------- */

.control-plate {
  width: 232px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 14px 18px;
  border-radius: 12px;
  /* brushed aluminum: vertical brush lines + vertical sheen */
  background:
    linear-gradient(180deg,
      rgba(255, 255, 255, .30) 0%,
      rgba(255, 255, 255, .05) 9%,
      rgba(255, 255, 255, 0) 30%,
      rgba(0, 0, 0, .08) 80%,
      rgba(0, 0, 0, .22) 100%),
    repeating-linear-gradient(90deg,
      #b7b3a9 0px, #aaa69c 1px, #b2aea4 2px, #aca89e 3px),
    #aeaaa0;
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .55),
    inset 0 -2px 3px rgba(0, 0, 0, .35),
    inset 1px 0 1px rgba(255, 255, 255, .25),
    0 0 0 1px rgba(40, 24, 10, .55),
    0 3px 7px rgba(0, 0, 0, .5);
}

.plate-title {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .26em;
  text-indent: .26em;
  text-transform: uppercase;
  color: #3a332a;
  text-shadow: 0 1px 0 rgba(255, 255, 255, .4);
  user-select: none;
}

.plate-sub {
  font-size: 7px;
  font-weight: 600;
  letter-spacing: .3em;
  text-indent: .3em;
  text-transform: uppercase;
  color: #6a6257;
  text-shadow: 0 1px 0 rgba(255, 255, 255, .35);
  margin-top: 3px;
  user-select: none;
}

.knob-station {
  position: relative;
  user-select: none;
}
.station-channel  { width: 202px; height: 188px; margin-top: 10px; }
.station-renderer { width: 202px; height: 164px; margin-top: 2px; }

.knob-station svg.dial {
  position: absolute;
  inset: 0;
  overflow: visible;
}
.dial text {
  fill: #332c23;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-weight: 700;
}
.dial line { stroke: #3a332a; stroke-width: 2; stroke-linecap: round; }
.dial .dial-caption { letter-spacing: .24em; font-size: 10px; }

/* ---- Knobs ---------------------------------------------------- */

.knob {
  position: absolute;
  padding: 0;
  border: 0;
  border-radius: 50%;
  cursor: pointer;
  touch-action: manipulation;
  /* skirt */
  background: radial-gradient(circle at 50% 32%, #3c3830 0%, #1b1813 55%, #070605 100%);
  box-shadow:
    0 5px 10px rgba(0, 0, 0, .55),
    0 2px 3px rgba(0, 0, 0, .5),
    inset 0 1px 1px rgba(255, 255, 255, .22),
    inset 0 -2px 3px rgba(0, 0, 0, .8);
}
#knob-channel  { width: 84px; height: 84px; left: 59px; top: 48px; }
#knob-renderer { width: 68px; height: 68px; left: 67px; top: 58px; }

.knob:focus-visible {
  outline: 3px solid #ffc864;
  outline-offset: 4px;
}
.knob:disabled {
  cursor: not-allowed;
  filter: grayscale(.5) brightness(.65);
}
.knob:not(:disabled):active .grip { filter: brightness(1.12); }

.grip {
  position: absolute;
  inset: 5px;
  border-radius: 50%;
  display: block;
  /* ribbed edge */
  background:
    radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 0 58%, rgba(0,0,0,.25) 75%),
    repeating-conic-gradient(from 0deg,
      #45403a 0deg 4deg,
      #14110d 4deg 9deg);
  box-shadow:
    inset 0 2px 3px rgba(255, 255, 255, .14),
    inset 0 -3px 5px rgba(0, 0, 0, .75);
  transform: rotate(var(--angle, 0deg));
  transition: transform 120ms cubic-bezier(.34, 1.45, .64, 1); /* detent snap */
}
.grip::before { /* center cap */
  content: '';
  position: absolute;
  inset: 19%;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 28%, #524a3f 0%, #262019 52%, #0d0b08 100%);
  box-shadow:
    0 2px 4px rgba(0, 0, 0, .85),
    inset 0 1px 1px rgba(255, 255, 255, .18);
}
.grip::after { /* pointer line */
  content: '';
  position: absolute;
  left: calc(50% - 1.5px);
  top: 8%;
  width: 3px;
  height: 30%;
  border-radius: 2px;
  background: linear-gradient(180deg, #f4ead2 0%, #cfc3a3 100%);
  box-shadow: 0 0 2px rgba(0, 0, 0, .75);
}

@media (prefers-reduced-motion: reduce) {
  .grip { transition: none; }
}

/* ---- Readout + power ------------------------------------------ */

.knob-readout {
  margin-top: 14px;
  min-width: 176px;
  padding: 7px 10px 6px;
  text-align: center;
  border-radius: 6px;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .1em;
  color: #ffb957;
  text-shadow: 0 0 7px rgba(255, 150, 40, .6);
  background: linear-gradient(180deg, #0b0a08 0%, #181307 100%);
  box-shadow:
    inset 0 2px 6px rgba(0, 0, 0, .9),
    inset 0 0 14px rgba(120, 70, 10, .25),
    0 1px 0 rgba(255, 255, 255, .4);
  user-select: none;
}

/* engraved ventilation grooves filling the lower plate */
.plate-vents {
  margin-top: auto;
  width: 152px;
  height: 52px;
  border-radius: 2px;
  background: repeating-linear-gradient(180deg,
    rgba(0, 0, 0, .26) 0 2px,
    rgba(255, 255, 255, .25) 2px 3px,
    rgba(0, 0, 0, 0) 3px 10px);
}

.power-row {
  padding-top: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  user-select: none;
}

.led {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #4a4a44, #22221e 70%);
  box-shadow:
    inset 0 1px 2px rgba(0, 0, 0, .8),
    0 1px 0 rgba(255, 255, 255, .35);
}
body[data-power="on"] .led {
  background: radial-gradient(circle at 35% 30%, #b6ffc8, #46e06b 45%, #14843a 100%);
  box-shadow:
    0 0 8px 2px rgba(70, 224, 107, .55),
    inset 0 1px 1px rgba(255, 255, 255, .6);
}
body[data-power="bypass"] .led {
  background: radial-gradient(circle at 35% 30%, #ffe9b0, #ffb02e 45%, #a35f06 100%);
  box-shadow:
    0 0 8px 2px rgba(255, 176, 46, .55),
    inset 0 1px 1px rgba(255, 255, 255, .6);
}

.power-label {
  font-size: 8px;
  font-weight: 700;
  letter-spacing: .3em;
  text-indent: .3em;
  color: #3a332a;
  text-shadow: 0 1px 0 rgba(255, 255, 255, .4);
}

/* ---- Legs + floor shadow -------------------------------------- */

.leg {
  position: absolute;
  bottom: -58px;
  width: 36px;
  height: 66px;
  z-index: 0;
  background: linear-gradient(100deg, #5d3a1e 0%, #46280f 55%, #2a1606 100%);
  clip-path: polygon(10% 0, 90% 0, 64% 100%, 42% 100%);
  filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .5));
}
.leg-left  { left: 70px;  transform: rotate(-6deg); }
.leg-right { right: 70px; transform: rotate(6deg); }

.floor-shadow {
  position: absolute;
  left: 4%;
  bottom: -78px;
  width: 92%;
  height: 30px;
  z-index: -1;
  background: radial-gradient(closest-side, rgba(0, 0, 0, .6), rgba(0, 0, 0, 0) 72%);
  filter: blur(5px);
  pointer-events: none;
}

/* ---- Bench ------------------------------------------------------ */
/* Schema-driven parameter panel below the cabinet. Deliberately "lab
   equipment" rather than 1970s — it's the service bench, not the set. */

.bench {
  width: 960px;
  padding: 0 0 48px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
  align-items: start;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

.bench-note {
  grid-column: 1 / -1;
  margin: 0;
  text-align: center;
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: #565e6b;
}

.bench-head {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 14px;
}
.bench-head h2 {
  flex: 1;
  margin: 0;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: #b9c1cd;
}
.bench-fps {
  font-size: 11px;
  letter-spacing: .08em;
  color: #5ee2ff;
}
.bench-copy {
  padding: 5px 12px 4px;
  border: 1px solid #2a2e36;
  border-radius: 5px;
  background: #191c22;
  color: #9aa1ad;
  font: inherit;
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  cursor: pointer;
}
.bench-copy:hover { border-color: #3a4049; color: #c2c8d2; }

.bench-group {
  margin: 0;
  min-width: 0;
  padding: 10px 14px 14px;
  border: 1px solid #2a2e36;
  border-radius: 8px;
  background: rgba(255, 255, 255, .015);
}
.bench-group legend {
  padding: 0 7px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: #7d8694;
}

.bench-item + .bench-item { margin-top: 12px; }

.bench-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: #c2c8d2;
  cursor: pointer;
}
.bench-toggle input {
  margin: 0;
  accent-color: #5ee2ff;
}
.bench-toggle .badge { margin-left: auto; }

.bench-desc {
  margin: 3px 0 5px 21px;
  font-size: 10px;
  line-height: 1.5;
  color: #6a7280;
}

.bench-param {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 3px 0 3px 21px;
  font-size: 10px;
  color: #8d96a4;
}
.bench-param > span:first-child { min-width: 92px; }
.bench-param input[type="range"] {
  flex: 1;
  min-width: 0;
  accent-color: #5ee2ff;
}
.bench-param output {
  min-width: 38px;
  text-align: right;
  color: #c2c8d2;
}

/* scope pills */
.bench .badge {
  padding: 1px 7px;
  border: 1px solid;
  border-radius: 999px;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  white-space: nowrap;
}
.badge-universal   { color: #8d96a4; border-color: #3a4049; }
.badge-trinitron   { color: #5ee2ff; border-color: rgba(94, 226, 255, .4); }
.badge-shadow-mask { color: #ff5ec8; border-color: rgba(255, 94, 200, .4); }
</style>
</head>
<body>
  <main class="bay">
    <h1 class="bay-title">Interslice Systems · Television Service Bay</h1>

    <div class="tv-cabinet">
      <!-- woodgrain body -->
      <svg class="cab-wood" aria-hidden="true">
        <defs>
          <linearGradient id="walnut" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0"   stop-color="#6e4527"/>
            <stop offset=".45" stop-color="#5b371d"/>
            <stop offset="1"   stop-color="#402312"/>
          </linearGradient>
          <!-- broad cathedral streaks: slow along X, fast along Y -> horizontal grain -->
          <filter id="grain-broad" x="-2%" y="-2%" width="104%" height="104%">
            <feTurbulence type="fractalNoise" baseFrequency="0.012 0.12" numOctaves="4" seed="14"/>
            <feColorMatrix type="matrix" values="
              0   0   0  0  0.15
              0   0   0  0  0.07
              0   0   0  0  0.03
              1.1 0.7 0  0 -0.50"/>
          </filter>
          <!-- fine pore grain -->
          <filter id="grain-fine" x="-2%" y="-2%" width="104%" height="104%">
            <feTurbulence type="fractalNoise" baseFrequency="0.02 0.55" numOctaves="2" seed="5"/>
            <feColorMatrix type="matrix" values="
              0 0   0  0  0.10
              0 0   0  0  0.05
              0 0   0  0  0.02
              0 1.4 0  0 -0.62"/>
          </filter>
          <!-- pale early-wood highlight bands -->
          <filter id="grain-light" x="-2%" y="-2%" width="104%" height="104%">
            <feTurbulence type="fractalNoise" baseFrequency="0.010 0.09" numOctaves="3" seed="41"/>
            <feColorMatrix type="matrix" values="
              0   0 0  0  0.82
              0   0 0  0  0.58
              0   0 0  0  0.34
              0 1.3 0  0 -0.72"/>
          </filter>
        </defs>
        <rect width="100%" height="100%" fill="url(#walnut)"/>
        <rect width="100%" height="100%" filter="url(#grain-light)" opacity="0.42"/>
        <rect width="100%" height="100%" filter="url(#grain-broad)" opacity="0.95"/>
        <rect width="100%" height="100%" filter="url(#grain-fine)"  opacity="0.5"/>
      </svg>
      <div class="cab-sheen"  aria-hidden="true"></div>
      <div class="cab-groove" aria-hidden="true"></div>

      <div class="cab-inner">
        <div class="screen-zone">
          <div class="bezel">
            <div class="screen-cutout">
              <canvas id="crt"    width="1280" height="960"></canvas><!-- WebGL; renderer sets backing = canvasSize × DPR -->
              <canvas id="bypass" width="640"  height="480" hidden></canvas>
            </div>
            <span class="bezel-text" aria-hidden="true">Solid State · CV-2001</span>
          </div>
          <div class="grille" aria-hidden="true">
            <span class="badge">INTERSLICE</span>
          </div>
        </div>

        <div class="control-plate">
          <div class="plate-title">Service Tuner</div>
          <div class="plate-sub">Solid State Chassis</div>

          <div class="knob-station station-channel">
            <svg class="dial" viewBox="0 0 202 188" width="202" height="188" aria-hidden="true">
              <!-- ticks at -120,-72,-24,24,72,120 deg (r 46->53 about 101,90) -->
              <line x1="61.2"  y1="113"   x2="55.1"  y2="116.5"/>
              <line x1="57.3"  y1="75.8"  x2="50.6"  y2="73.6"/>
              <line x1="82.3"  y1="48"    x2="79.4"  y2="41.6"/>
              <line x1="119.7" y1="48"    x2="122.6" y2="41.6"/>
              <line x1="144.7" y1="75.8"  x2="151.4" y2="73.6"/>
              <line x1="140.8" y1="113"   x2="146.9" y2="116.5"/>
              <!-- VHF numbers, r=67 -->
              <text x="43"    y="123.5" font-size="13" text-anchor="middle" dy=".35em">2</text>
              <text x="37.3"  y="69.3"  font-size="13" text-anchor="middle" dy=".35em">3</text>
              <text x="73.8"  y="28.8"  font-size="13" text-anchor="middle" dy=".35em">4</text>
              <text x="128.2" y="28.8"  font-size="13" text-anchor="middle" dy=".35em">5</text>
              <text x="164.7" y="69.3"  font-size="13" text-anchor="middle" dy=".35em">6</text>
              <text x="159"   y="123.5" font-size="13" text-anchor="middle" dy=".35em">7</text>
              <text class="dial-caption" x="101" y="180" text-anchor="middle">CHANNEL</text>
            </svg>

          </div>

              <!-- ticks at -60,0,60 deg (r 38->45 about 101,92) -->
              <line x1="68.1"  y1="73" x2="62.0"  y2="69.5"/>
              <line x1="101"   y1="54" x2="101"   y2="47"/>
              <line x1="133.9" y1="73" x2="140.0" y2="69.5"/>
              <!-- position labels, r=58 -->
              <text x="56.8"  y="63" font-size="8.5" letter-spacing="1" text-anchor="end">TRINITRON</text>
              <text x="101"   y="30" font-size="8.5" letter-spacing="1" text-anchor="middle">SHADOW MASK</text>
              <text x="145.2" y="63" font-size="8.5" letter-spacing="1" text-anchor="start">BYPASS</text>

      <span class="leg leg-left"  aria-hidden="true"></span>
      <span class="leg leg-right" aria-hidden="true"></span>

    <section class="bench" id="bench"><!-- populated by rebuildBench() --></section>
  </main>
<script src="trinitron.js"></script>
<script src="shadow-mask.js"></script>
<script>
(function () {
  'use strict';
  // Bench facility: ?res=640 doubles the signal grid — the "clean
  // consumer signal on a nice tube" experiment (~DVD/S-Video resolving
  // power; triad pitch ≈ a real Trinitron's at this display size).
  // 320 (default) is the shipped preset look. The display size is
  // fixed either way; only the grid feeding it changes.
  const RES = new URLSearchParams(location.search).get('res') === '640' ? 640 : 320;
  const SIGNAL_W = RES, SIGNAL_H = RES * 3 / 4;
  const RENDERERS = ['trinitron', 'shadow-mask', 'bypass'];

  // --- Channels --------------------------------------------------------

  // CH 2 — SMPTE color bars (75% bars / castellation strip / PLUGE bottom)
  function drawSmpteBars(ctx, t, w, h) {
    const topH = Math.round(h * 0.67);          // 161 @ 240 — main bars
    const midH = Math.round(h * 0.08);          // 19  — castellation strip
    const by = topH + midH, bh = h - by;        // 60  — bottom quarter
    const bw = w / 7;
    // 75% bars: gray, yellow, cyan, green, magenta, red, blue
    const top = ['#c0c0c0', '#c0c000', '#00c0c0', '#00c000', '#c000c0', '#c00000', '#0000c0'];
    // castellations: reverse-bar correspondence — blue, black, magenta, black, cyan, black, gray
    const mid = ['#0000c0', '#131313', '#c000c0', '#131313', '#00c0c0', '#131313', '#c0c0c0'];
    for (let i = 0; i < 7; i++) {
      const x0 = Math.round(i * bw), x1 = Math.round((i + 1) * bw);
      ctx.fillStyle = top[i]; ctx.fillRect(x0, 0, x1 - x0, topH);
      ctx.fillStyle = mid[i]; ctx.fillRect(x0, topH, x1 - x0, midH);
    }
    // Bottom row, in units of w/28 (4 units = 1 bar width):
    // -I, 100% white, +Q, black — 5/4 bar each (5 bars total) —
    // then the PLUGE (3.5 / 7.5 / 11.5 IRE, 1/3 bar each) under the red bar,
    // and setup black under the blue bar.
    const u = w / 28;
    const bot = [['#00214c', 5], ['#ffffff', 5], ['#32006a', 5], ['#131313', 5],
                 ['#090909', 4 / 3], ['#131313', 4 / 3], ['#1d1d1d', 4 / 3], ['#131313', 4]];
    let x = 0;
    for (const [c, units] of bot) {
      const x0 = Math.round(x * u), x1 = Math.round((x + units) * u);
      ctx.fillStyle = c; ctx.fillRect(x0, by, x1 - x0, bh);
      x += units;
    }
  }

  // CH 3 — convergence crosshatch (the CRT service pattern)
  function drawCrosshatch(ctx, t, w, h) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    const step = 20;                       // 16×12 cells at 320×240
    ctx.beginPath();
    for (let x = step; x < w; x += step) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, h); }
    for (let y = step; y < h; y += step) { ctx.moveTo(0, y + 0.5); ctx.lineTo(w, y + 0.5); }
    ctx.stroke();
    ctx.strokeRect(0.5, 0.5, w - 1, h - 1);
    ctx.fillStyle = '#fff';                // dots at cell centers
    for (let y = step / 2; y < h; y += step)
      for (let x = step / 2; x < w; x += step)
        ctx.fillRect(x - 1, y - 1, 2, 2);
  }

  // CH 4 — Interslice test card (PM5544-flavored)
  function drawTestCard(ctx, t, w, h) {
    ctx.fillStyle = '#3a3a3a'; ctx.fillRect(0, 0, w, h);
    const step = 20;                       // background grid, 16×12 cells
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = step; x < w; x += step) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, h); }
    for (let y = step; y < h; y += step) { ctx.moveTo(0, y + 0.5); ctx.lineTo(w, y + 0.5); }
    ctx.stroke();
    ctx.strokeRect(0.5, 0.5, w - 1, h - 1);          // edge line closes the border cells
    const cx = w / 2, cy = h / 2, r = h * 0.46;
    ctx.save();                            // big circle, clipped contents
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = '#e8e8e8'; ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r);
    // 75% color bars across the top of the circle
    const bars = ['#c0c000', '#00c0c0', '#00c000', '#c000c0', '#c00000', '#0000c0'];
    const bw2 = (2 * r) / bars.length;
    const barTop = Math.round(cy - r), barBot = Math.round(cy - r * 0.45);
    for (let i = 0; i < bars.length; i++) {
      const x0 = Math.round(cx - r + i * bw2), x1 = Math.round(cx - r + (i + 1) * bw2);
      ctx.fillStyle = bars[i]; ctx.fillRect(x0, barTop, x1 - x0, barBot - barTop);
    }
    // frequency gratings — vertical line bundles at rising pitch, centered on cx
    const pitches = [8, 6, 4, 3, 2];
    const gratingW = pitches.reduce((sum, p) => sum + 8 * p, 0);   // 184 px
    const gy = Math.round(cy + r * 0.25), gh = Math.round(r * 0.3);
    let gx = Math.round(cx - gratingW / 2);                        // integer → crisp stripes
    for (const pitch of pitches) {
      for (let i = 0; i < 8; i++, gx += pitch) {
        ctx.fillStyle = i % 2 ? '#e8e8e8' : '#111';
        ctx.fillRect(gx, gy, pitch, gh);
      }
    }
    const fs = w / 320;                    // resolution-proportional type — same physical
    ctx.fillStyle = '#111';                // size through either grid, so the legibility
    ctx.fillRect(cx - 95 * fs, cy - 26 * fs, 190 * fs, 48 * fs);   // A/B tests the tube, not the font
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `700 ${Math.round(16 * fs)}px monospace`;
    ctx.fillText('INTERSLICE SYSTEMS', cx, cy - 9 * fs);
    ctx.font = `400 ${Math.round(11 * fs)}px monospace`;
    ctx.fillText('· PLEASE STAND BY ·', cx, cy + 11 * fs);
    ctx.restore();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;   // circle outline
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#fff';                // corner registration marks
    for (const [mx, my] of [[10, 10], [w - 10, 10], [10, h - 10], [w - 10, h - 10]]) {
      ctx.fillRect(mx - 6, my - 1, 12, 2); ctx.fillRect(mx - 1, my - 6, 2, 12);
    }
  }

  // CH 5 — "INTERSLICE SYSTEMS" demo reel. 40 s loop, eight scenes with
  // hard cuts (each opening on a 90 ms bloom flash), broadcast-ident style:
  // CRT power-on + station ident → parallax starfield accelerating to warp →
  // copper bars + sine scroller → vector tunnel → additive plasma weave with
  // a CH·5 knockout → RGB-split wordmark bounce over a synth floor → moiré
  // roses → sign-off + CRT collapse (which wraps cleanly into the power-on).
  // Deterministic in t; lookup tables built once via function statics, no
  // per-frame buffer allocations.
  function drawMotionReel(ctx, t, w, h) {
    let S = drawMotionReel._S;
    if (!S) {                              // one-time static tables
      S = drawMotionReel._S = {};
      let seed = 0x5EED5;                  // mulberry32 — deterministic layout
      const rnd = () => {
        seed = seed + 0x6D2B79F5 | 0;
        let z = Math.imul(seed ^ seed >>> 15, 1 | seed);
        z = z + Math.imul(z ^ z >>> 7, 61 | z) ^ z;
        return ((z ^ z >>> 14) >>> 0) / 4294967296;
      };
      S.N = 150;
      S.stars = new Float32Array(S.N * 3); // x, y in [-1,1]; z phase in [0,1)
      S.starCol = new Uint8Array(S.N);
      for (let i = 0; i < S.N; i++) {
        S.stars[i * 3] = rnd() * 2 - 1;
        S.stars[i * 3 + 1] = rnd() * 2 - 1;
        S.stars[i * 3 + 2] = rnd();
        S.starCol[i] = i % 7 === 0 ? 1 : i % 5 === 0 ? 2 : 0;
      }
      S.hues = [];
      for (let i = 0; i < 60; i++) S.hues.push(`hsl(${i * 6},100%,62%)`);
      const copper = (r, g, b) => [.16, .42, .78, 1, .78, .42, .16]
        .map(k => `rgb(${r * k | 0},${g * k | 0},${b * k | 0})`);
      S.bars = [copper(255, 40, 200), copper(40, 220, 255), copper(255, 230, 60),
                copper(255, 40, 200), copper(40, 220, 255), copper(235, 240, 255)];
      S.pm = []; S.pc = []; S.py = [];     // plasma ramps: magenta / cyan / amber
      for (let i = 0; i < 48; i++) {
        const k = i / 47;
        S.pm.push(`rgba(${40 + 215 * k | 0},${k * k * 70 | 0},${120 + 135 * k | 0},0.5)`);
        S.pc.push(`rgba(${k * k * 80 | 0},${60 + 190 * k | 0},${150 + 105 * k | 0},0.5)`);
        S.py.push(`rgba(${60 + 195 * k | 0},${40 + 200 * k | 0},${k * k * 90 | 0},0.35)`);
      }
      S.msg = '*** INTERSLICE SYSTEMS ***  BUILDING THE FUTURE, TOMORROW!  ***' +
              '  CH-5 PHOSPHOR DEMO REEL  ***  GREETZ TO ALL TRINITRON HEADS  ***';
      S.glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 48);   // warp-core glow sprite
      S.glow.addColorStop(0, 'rgba(225,240,255,0.9)');
      S.glow.addColorStop(0.35, 'rgba(150,195,255,0.5)');
      S.glow.addColorStop(1, 'rgba(120,180,255,0)');
    }
    const TAU = Math.PI * 2, PERIOD = 40000;
    const tt = ((t % PERIOD) + PERIOD) % PERIOD;
    const cx = w / 2, cy = h / 2;
    const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
    const fract = x => x - Math.floor(x);
    const BG = '#04060f';
    const CUTS = [4000, 10000, 16000, 22000, 28000, 34000, 37400, 40000];
    let sn = 0;
    while (tt >= CUTS[sn]) sn++;
    const ts = tt - (sn === 0 ? 0 : CUTS[sn - 1]);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (sn === 0) {
      // ---- scene 0: CRT power-on, then station ident ----
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
      if (ts < 560) {                      // dot → line → raster bloom-up
        const p = ts / 560;
        ctx.globalCompositeOperation = 'lighter';
        if (p < 0.42) {
          const q = p / 0.42, e = 1 - (1 - q) * (1 - q);
          const lw = Math.max(3, e * w * 0.96);
          ctx.fillStyle = 'rgba(140,180,255,0.35)'; ctx.fillRect(cx - lw / 2, cy - 4, lw, 8);
          ctx.fillStyle = '#fff'; ctx.fillRect(cx - lw / 2, cy - 1, lw, 2);
        } else {
          const q = (p - 0.42) / 0.58, e = 1 - (1 - q) * (1 - q);
          const vh = Math.max(2, e * h);
          ctx.fillStyle = `rgba(150,185,255,${0.9 - 0.75 * e})`; ctx.fillRect(0, cy - vh / 2, w, vh);
          ctx.fillStyle = `rgba(255,255,255,${1 - 0.8 * e})`; ctx.fillRect(0, cy - 1.5, w, 3);
        }
      } else {
        const ti = ts - 560;
        ctx.fillStyle = BG; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = 'rgba(160,200,255,0.05)';            // drifting scan band
        ctx.fillRect(0, fract(ti * 0.00022) * (h + 60) - 30, w, 26);
        const fadeIn = clamp(ti / 420, 0, 1);
        ctx.globalAlpha = fadeIn * (0.92 + 0.08 * Math.sin(ti * 0.21));
        ctx.font = 'bold 34px monospace';
        const off = 2 + (ti < 700 ? (700 - ti) * 0.02 : 0);  // fringes converge on entry
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = 'rgba(255,40,210,0.9)'; ctx.fillText('INTERSLICE', cx - off, 88);
        ctx.fillStyle = 'rgba(40,220,255,0.9)'; ctx.fillText('INTERSLICE', cx + off, 88);
        ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.fillText('INTERSLICE', cx, 88);
        ctx.globalCompositeOperation = 'source-over';
        if (ti > 350) {
          ctx.globalAlpha = clamp((ti - 350) / 350, 0, 1);
          ctx.font = 'bold 15px monospace'; ctx.fillStyle = '#35e0ff';
          ctx.fillText('S Y S T E M S', cx, 120);
        }
        ctx.globalAlpha = 1;
        if (ti > 500) {                                       // yellow rule grows out
          const rw = clamp((ti - 500) / 400, 0, 1) * 220;
          ctx.fillStyle = '#ffe93c'; ctx.fillRect(cx - rw / 2, 134, rw, 2);
        }
        if (ti > 900) {                                       // tagline types on
          const n = Math.min(30, (ti - 900) / 55 | 0);
          const msg = 'BUILDING THE FUTURE, TOMORROW!'.slice(0, n);
          ctx.font = '11px monospace'; ctx.fillStyle = '#ffe93c';
          ctx.fillText(msg, cx, 160);
          if (n < 30 || ((ti / 260) | 0) % 2 === 0) {
            ctx.fillRect(cx + ctx.measureText(msg).width / 2 + 3, 155, 6, 10);
          }
        }
        if (ti > 1500) {
          ctx.globalAlpha = 0.8; ctx.font = '9px monospace'; ctx.fillStyle = '#7a86b8';
          ctx.fillText('CH·5 · DEMO REEL · EST. 1986 · 60 FIELDS/SEC', cx, h - 18);
          ctx.globalAlpha = 1;
        }
        const sp = (ti - 1100) / 900;                         // gloss sweep over the title
        if (sp > 0 && sp < 1) {
          ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.22;
          ctx.fillStyle = '#fff';
          ctx.save(); ctx.translate(-80 + sp * (w + 160), 0);
          ctx.transform(1, 0, -0.35, 1, 0, 0); ctx.fillRect(0, 58, 26, 64); ctx.restore();
          ctx.globalAlpha = 1;
        }
      }

    } else if (sn === 1) {
      // ---- scene 1: parallax starfield, accelerating into warp streaks ----
      ctx.fillStyle = '#010208'; ctx.fillRect(0, 0, w, h);
      const u = clamp((ts - 3300) / 2400, 0, 1);              // warp ramp
      const shift = 0.00013 * ts + 1.5 * u * u;
      const streak = 0.006 + u * 0.07;
      ctx.globalCompositeOperation = 'lighter';                // core glow swells with speed
      ctx.save(); ctx.translate(cx, cy);
      const gs = (16 + u * 32) / 48;
      ctx.scale(gs, gs); ctx.globalAlpha = 0.55 + u * 0.45;
      ctx.fillStyle = S.glow; ctx.fillRect(-48, -48, 96, 96);
      ctx.restore();
      const cols = ['rgba(205,228,255,', 'rgba(255,90,230,', 'rgba(255,235,120,'];
      for (let ci = 0; ci < 3; ci++) {
        for (let near = 0; near < 2; near++) {                // depth-bucketed batching
          ctx.beginPath();
          for (let i = 0; i < S.N; i++) {
            if (S.starCol[i] !== ci) continue;
            const z = fract(S.stars[i * 3 + 2] - shift) * 0.96 + 0.04;
            if (near ? z >= 0.45 : z < 0.45) continue;
            const f1 = 0.22 / z, f2 = 0.22 / Math.min(1, z + streak);
            const x1 = cx + S.stars[i * 3] * f1 * cx, y1 = cy + S.stars[i * 3 + 1] * f1 * cy;
            if (x1 < -4 || x1 > w + 4 || y1 < -4 || y1 > h + 4) continue;
            ctx.moveTo(cx + S.stars[i * 3] * f2 * cx, cy + S.stars[i * 3 + 1] * f2 * cy);
            ctx.lineTo(x1, y1 + 0.01);
          }
          ctx.strokeStyle = cols[ci] + (near ? '1)' : '0.62)');
          ctx.lineWidth = near ? 2.2 : 1.3;
          ctx.stroke();
        }
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.font = '9px monospace'; ctx.textAlign = 'left'; ctx.fillStyle = '#5e6aa0';
      ctx.fillText('VELOCITY TEST // SECTOR 7G', 8, h - 10);
      ctx.textAlign = 'center';
      if (u > 0 && u < 1 && ((ts / 120) | 0) % 2 === 0) {
        ctx.font = 'bold 13px monospace'; ctx.fillStyle = '#ffe93c';
        ctx.fillText('— ENGAGE —', cx, h - 30);
      }

    } else if (sn === 2) {
      // ---- scene 2: copper bars + rainbow sine scroller ----
      ctx.fillStyle = '#03040c'; ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'lighter';
      for (let b = 0; b < 6; b++) {
        const yb = cy - 7 + Math.sin(ts * 0.0021 + b * 0.97) * h * 0.34
                 + Math.sin(ts * 0.00063 + b * 2.1) * 16;
        for (let r = 0; r < 7; r++) {
          ctx.fillStyle = S.bars[b][r]; ctx.fillRect(0, yb + r * 2, w, 2);
        }
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.font = 'bold 21px monospace';
      if (!S.cw) S.cw = ctx.measureText('M').width;
      const scroll = ts * 0.17;
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,12,0.75)';
      for (let i = 0; i < S.msg.length; i++) {
        const x = w + i * S.cw - scroll;
        if (x < -16) continue;
        if (x > w + 16) break;
        const y = cy + Math.sin(x * 0.035 + ts * 0.005) * 30;
        ctx.strokeText(S.msg[i], x, y);                       // dark rim for legibility
        ctx.fillStyle = S.hues[(i * 3 + (ts * 0.018 | 0)) % 60];
        ctx.fillText(S.msg[i], x, y);
      }

    } else if (sn === 3) {
      // ---- scene 3: twisting vector tunnel, Lissajous throat ----
      ctx.fillStyle = '#02030a'; ctx.fillRect(0, 0, w, h);
      const tx = cx + Math.sin(ts * 0.0011) * 44, ty = cy + Math.sin(ts * 0.0017 + 1.2) * 28;
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineJoin = 'round';
      for (let i = 0; i < 16; i++) {
        const zf = fract(i / 16 + ts * 0.00021);
        const rad = 4 + Math.pow(zf, 2.4) * 300;
        const rot = ts * 0.00085 + zf * 2.4;                  // per-depth twist
        ctx.strokeStyle = S.hues[(i * 7 + (ts * 0.02 | 0)) % 60];
        ctx.globalAlpha = 0.22 + zf * 0.78;
        ctx.lineWidth = 1 + zf * 2.2;
        ctx.beginPath();
        for (let v = 0; v <= 8; v++) {
          const a = rot + v / 8 * TAU;
          const px = tx + Math.cos(a) * rad, py = ty + Math.sin(a) * rad * 0.86;
          v ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(120,200,255,0.25)';
      ctx.beginPath(); ctx.arc(tx, ty, 7, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.arc(tx, ty, 2.2, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.font = '9px monospace'; ctx.textAlign = 'right'; ctx.fillStyle = '#5e6aa0';
      ctx.fillText('VECTOR TUNNEL // OCT-8', w - 8, h - 10);
      ctx.textAlign = 'center';

    } else if (sn === 4) {
      // ---- scene 4: additive plasma weave (rows + cols + rotating diagonal),
      // CH·5 punched out dark ----
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'lighter';
      const T = ts * 0.001;
      for (let y = 0; y < h; y += 2) {
        const v = Math.sin(y * 0.046 + T * 1.9) + Math.sin(y * 0.012 - T * 1.2)
                + Math.sin(y * 0.024 + Math.sin(T * 0.7) * 2);
        ctx.fillStyle = S.pm[clamp((v + 3) / 6 * 47 | 0, 0, 47)];
        ctx.fillRect(0, y, w, 2);
      }
      for (let x = 0; x < w; x += 2) {
        const v = Math.sin(x * 0.041 - T * 1.6) + Math.sin(x * 0.011 + T * 1.05)
                + Math.sin(x * 0.027 + Math.sin(T * 0.9 + 2) * 2);
        ctx.fillStyle = S.pc[clamp((v + 3) / 6 * 47 | 0, 0, 47)];
        ctx.fillRect(x, 0, 2, h);
      }
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(0.6 + Math.sin(T * 0.5) * 0.5);
      for (let d = -200; d < 200; d += 4) {
        const v = Math.sin(d * 0.05 + T * 2.3) + Math.sin(d * 0.017 - T * 0.8);
        ctx.fillStyle = S.py[clamp((v + 2) / 4 * 47 | 0, 0, 47)];
        ctx.fillRect(-220, d, 440, 4);
      }
      ctx.restore();
      ctx.font = 'bold 64px monospace';
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
      ctx.strokeText('CH·5', cx, cy + 2);                // bright rim…
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#02030a';
      ctx.fillText('CH·5', cx, cy + 2);                  // …around a dark knockout

    } else if (sn === 5) {
      // ---- scene 5: RGB-split wordmark tumbling over a scrolling synth floor ----
      ctx.fillStyle = BG; ctx.fillRect(0, 0, w, h);
      const hor = h * 0.62;
      ctx.strokeStyle = 'rgba(40,220,255,0.34)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {                          // floor rushes toward viewer
        const k = fract(i / 10 + ts * 0.00021), y = hor + (h - hor) * k * k;
        ctx.moveTo(0, y); ctx.lineTo(w, y);
      }
      for (let i = -4; i <= 4; i++) {
        ctx.moveTo(cx + i * 10, hor); ctx.lineTo(cx + i * 70, h + 8);
      }
      ctx.stroke();
      ctx.fillStyle = 'rgba(40,220,255,0.5)'; ctx.fillRect(0, hor, w, 1);
      ctx.font = 'bold 32px monospace';
      ctx.globalCompositeOperation = 'lighter';
      const pose = tm => [cx + Math.sin(tm * 0.0016) * 38,
                          h * 0.34 + Math.sin(tm * 0.0027 + 0.7) * 34,
                          Math.sin(tm * 0.0012) * 0.42,
                          1 + 0.22 * Math.sin(tm * 0.0021 + 1.1)];
      for (let g = 4; g >= 1; g--) {                          // explicit ghost trail
        const [gx, gy, gr, gs] = pose(ts - g * 55);
        ctx.save(); ctx.translate(gx, gy); ctx.rotate(gr); ctx.scale(gs, gs);
        ctx.globalAlpha = 0.17 - 0.03 * g;
        ctx.fillStyle = g % 2 ? 'rgba(255,40,210,1)' : 'rgba(40,220,255,1)';
        ctx.fillText('INTERSLICE', 0, 0);
        ctx.restore();
      }
      const [px, py, pr, ps] = pose(ts);
      ctx.save(); ctx.translate(px, py); ctx.rotate(pr); ctx.scale(ps, ps);
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,40,210,0.9)'; ctx.fillText('INTERSLICE', -2.2, 0);
      ctx.fillStyle = 'rgba(40,220,255,0.9)'; ctx.fillText('INTERSLICE', 2.2, 0);
      ctx.fillStyle = '#fff'; ctx.fillText('INTERSLICE', 0, 0);
      ctx.restore();
      ctx.fillStyle = '#ffe93c';
      for (let k = 0; k < 6; k++) {                           // orbiting sparks
        const a = ts * 0.004 + k * TAU / 6;
        ctx.fillRect(px + Math.cos(a) * 82 - 1, py + Math.sin(a) * 30 - Math.sin(a * 2) * 8 - 1, 2, 2);
      }

    } else if (sn === 6) {
      // ---- scene 6: moiré roses — two drifting ring sets beat against
      // each other and the aperture grille ----
      ctx.fillStyle = '#020309'; ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'lighter';
      const gap = 6.5 + Math.sin(ts * 0.0012) * 2.2;
      const a = ts * 0.00085, ph = fract(ts * 0.0005) * gap;
      const sets = [[cx + Math.cos(a) * 36, cy + Math.sin(a) * 24, 'rgba(40,220,255,0.9)'],
                    [cx - Math.cos(a) * 36, cy - Math.sin(a) * 24, 'rgba(255,40,210,0.9)']];
      ctx.lineWidth = 1.4;
      for (const [ox, oy, col] of sets) {
        ctx.strokeStyle = col;
        ctx.beginPath();
        for (let r = ph + 1; r < 290; r += gap) {
          ctx.moveTo(ox + r, oy); ctx.arc(ox, oy, r, 0, TAU);
        }
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';             // breathing white radar rings
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = fract(i / 10 + ts * 0.00035) * 120 + 3;
        ctx.moveTo(cx + r, cy); ctx.arc(cx, cy, r, 0, TAU);
      }
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      ctx.font = '9px monospace'; ctx.textAlign = 'right'; ctx.fillStyle = '#5e6aa0';
      ctx.fillText('GRILLE STRESS // MOIRE ROSE', w - 8, h - 10);
      ctx.textAlign = 'center';

    } else {
      // ---- scene 7: sign-off card, then CRT collapse to a dot (loops
      // straight into scene 0's power-on) ----
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
      if (ts < 1700) {
        ctx.fillStyle = BG; ctx.fillRect(0, 0, w, h);
        ctx.globalCompositeOperation = 'lighter';
        ctx.font = 'bold 22px monospace';
        ctx.fillStyle = 'rgba(255,40,210,0.85)'; ctx.fillText('INTERSLICE SYSTEMS', cx - 1.5, 96);
        ctx.fillStyle = 'rgba(40,220,255,0.85)'; ctx.fillText('INTERSLICE SYSTEMS', cx + 1.5, 96);
        ctx.fillStyle = '#fff'; ctx.fillText('INTERSLICE SYSTEMS', cx, 96);
        ctx.globalCompositeOperation = 'source-over';
        ctx.font = '11px monospace'; ctx.fillStyle = '#35e0ff';
        ctx.fillText('TRANSMISSION COMPLETE', cx, 128);
        ctx.font = '10px monospace'; ctx.fillStyle = '#ffe93c';
        ctx.fillText('BUILDING THE FUTURE, TOMORROW!', cx, 150);
        if (((ts / 300) | 0) % 2 === 0) { ctx.fillStyle = '#fff'; ctx.fillRect(cx - 3, 168, 6, 9); }
      } else {
        const pa = (ts - 1700) / 900;
        ctx.globalCompositeOperation = 'lighter';
        if (pa < 0.42) {                                      // raster squashes vertically
          const q = pa / 0.42, e = q * q * (3 - 2 * q);
          const vh = Math.max(2, (1 - e) * h * 0.92);
          ctx.fillStyle = `rgba(150,190,255,${0.25 + 0.55 * e})`; ctx.fillRect(0, cy - vh / 2, w, vh);
          ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.65 * e})`; ctx.fillRect(0, cy - 1.5, w, 3);
        } else if (pa < 0.78) {                               // line shrinks to a dot
          const q = (pa - 0.42) / 0.36, lw = Math.max(4, (1 - q * q) * w);
          ctx.fillStyle = 'rgba(160,200,255,0.5)'; ctx.fillRect(cx - lw / 2, cy - 3.5, lw, 7);
          ctx.fillStyle = '#fff'; ctx.fillRect(cx - lw / 2, cy - 1.5, lw, 3);
        } else {                                              // dot afterglow fades out
          const al = 1 - (pa - 0.78) / 0.22;
          ctx.fillStyle = `rgba(190,215,255,${al * 0.5})`;
          ctx.beginPath(); ctx.arc(cx, cy, 5, 0, TAU); ctx.fill();
          ctx.fillStyle = `rgba(255,255,255,${al})`;
          ctx.beginPath(); ctx.arc(cx, cy, 2.2, 0, TAU); ctx.fill();
        }
      }
    }

    if (sn >= 1 && sn <= 6 && ts < 90) {                      // cut flash — feeds the bloom
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = `rgba(255,255,255,${0.8 * (1 - ts / 90)})`;
      ctx.fillRect(0, 0, w, h);
    }
    ctx.restore();
  }

  // CH 6 — dead-channel snow (also used as the channel-switch interstitial)
  // u32 writes assume little-endian (0xAABBGGRR → R,G,B,A bytes) — true on
  // every platform this targets; grayscale (R=G=B) limits the blast radius anyway.
  let snowImg = null, snowU32 = null;
  function drawSnow(ctx, t, w, h) {
    if (!snowImg || snowImg.width !== w || snowImg.height !== h) {
      snowImg = ctx.createImageData(w, h);
      snowU32 = new Uint32Array(snowImg.data.buffer);
    }
    for (let i = 0; i < snowU32.length; i++) {
      const v = (Math.random() * 256) | 0;
      snowU32[i] = 0xff000000 | (v << 16) | (v << 8) | v;
    }
    ctx.putImageData(snowImg, 0, 0);
  }

  // CH 7 — DITHER ("the Sonic waterfall test", spec §8). Transparency
  // and gradients faked the way 16-bit hardware did: alternating 1-px
  // vertical columns, checker dithers, stair-steps, single-pixel sprite
  // detail. Pass criterion: hard stripes on bypass; translucent shimmer
  // through either renderer. Static layers prerender once into function-
  // static canvases — per-frame work is ~a dozen drawImages plus the
  // foam checker.
  function drawDither(ctx, t, w, h) {
    let S = drawDither._S;
    if (!S) {
      S = drawDither._S = {};
      const make = (mw, mh, paint) => {
        const c = document.createElement('canvas');
        c.width = mw; c.height = mh;
        paint(c.getContext('2d'));
        return c;
      };
      const horizon = Math.round(h * 0.42);
      S.horizon = horizon;
      // Hill tiles: one sine period wide, filled to the bottom, with a
      // 4-px checker AA band along the crest (the Genesis edge-dither).
      const hillTile = (col, amp, base, period) => make(period, h, (c) => {
        c.fillStyle = col;
        for (let x = 0; x < period; x++) {
          const y = Math.round(base - amp * (0.6 + 0.4 * Math.sin(x * 2 * Math.PI / period)));
          c.fillRect(x, y, 1, h - y);
          for (let dy = -4; dy < 0; dy++) {
            if (((x + dy) & 1) === 0) c.fillRect(x, y + dy, 1, 1);
          }
        }
      });
      S.hillFar  = hillTile('#1d5a34', 14, horizon + 8,  90);
      S.hillNear = hillTile('#2e8048', 20, horizon + 26, 130);
      // Waterfall tile: one 26-px scroll period. Even columns water,
      // odd columns transparent — the scene shows through 50/50, the
      // Mega Drive transparency trick this channel exists to test.
      S.fallW = Math.round(w * 0.18);
      S.fall = make(S.fallW, 26, (c) => {
        for (let x = 0; x < S.fallW; x += 2) {
          for (let y = 0; y < 26; y++) {
            c.fillStyle = y < 7 ? '#bfe4ff' : y < 16 ? '#5aa0e8' : '#3a78cc';
            c.fillRect(x, y, 1, 1);
          }
        }
      });
      // Static panel: checker dither ramps (25/50/75% mixes), a 2×2
      // Bayer ordered-dither gradient bar, stair-step diagonals, label.
      S.panel = make(w, h, (c) => {
        const cA = '#e83048', cB = '#f8e858';
        [[1, 4], [1, 2], [3, 4]].forEach(([n, d], i) => {
          const y0 = 14 + i * 18;
          c.fillStyle = cB; c.fillRect(w - 96, y0, 84, 14);
          c.fillStyle = cA;
          for (let y = 0; y < 14; y++)
            for (let x = 0; x < 84; x++)
              if (((x + y) % d) < n) c.fillRect(w - 96 + x, y0 + y, 1, 1);
        });
        const bayer = [0, 2, 3, 1];               // 2×2 ordered dither
        for (let x = 0; x < 84; x++) {
          for (let y = 0; y < 10; y++) {
            const lvl = (x / 84) * 5 - 1;          // -1..4 across the bar
            const th = bayer[(x & 1) + 2 * (y & 1)];
            c.fillStyle = lvl > th ? '#35e0ff' : '#06101c';
            c.fillRect(w - 96 + x, 72 + y, 1, 1);
          }
        }
        c.fillStyle = '#ffffff';                   // stair-step diagonals
        for (const [run, i] of [[1, 0], [2, 1], [3, 2]]) {
          const x0 = w - 96, y0 = 102 + i * 18;
          for (let k = 0; k < 84; k++) c.fillRect(x0 + k, y0 + 13 - (((k / run) | 0) % 14), 1, 1);
        }
        c.font = '8px monospace'; c.fillStyle = '#cfe0ff';
        c.fillText('DITHER LAB // CH-7', 8, 10);
      });
      // 8×8 two-frame sprite with single-pixel eye detail. The leg rows
      // are deliberately asymmetric so the frame-2 mirror reads as a
      // real two-frame walk cycle.
      const rows = [
        '..3333..',
        '.355553.',
        '35777753',
        '35717753',
        '35777753',
        '.355553.',
        '.3...3..',
        '3.....3.',
      ];
      const cols = { 1: '#0a0a14', 3: '#143c8c', 5: '#2e78dc', 7: '#8cc8ff' };
      S.sprite = [0, 1].map((f) => make(8, 8, (c) => {
        rows.forEach((row, y) => {
          for (let x = 0; x < 8; x++) {
            const ch = row[(f === 1 && y >= 6) ? 7 - x : x];   // frame 2 mirrors the legs
            if (ch !== '.') { c.fillStyle = cols[ch]; c.fillRect(x, y, 1, 1); }
          }
        });
      }));
    }
    const fract = x => x - Math.floor(x);
    const horizon = S.horizon;
    const g = ctx.createLinearGradient(0, 0, 0, horizon);          // sky
    g.addColorStop(0, '#1c2c74'); g.addColorStop(1, '#3e68b8');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, horizon);
    ctx.fillStyle = '#3e68b8'; ctx.fillRect(0, horizon, w, h - horizon);
    for (const [tile, speed] of [[S.hillFar, 0.010], [S.hillNear, 0.022]]) {
      const off = Math.round(t * speed) % tile.width;              // parallax hills
      for (let x = -off; x < w; x += tile.width) ctx.drawImage(tile, x, 0);
    }
    ctx.fillStyle = '#7a5a30'; ctx.fillRect(0, h - 32, w, 32);     // ground
    const wx = Math.round(w * 0.16), wy0 = horizon - 14, wy1 = h - 26;
    const scroll = Math.round(t * 0.12) % 26;                      // the waterfall
    ctx.save();
    ctx.beginPath(); ctx.rect(wx, wy0, S.fallW, wy1 - wy0); ctx.clip();
    for (let y = wy0 - 26 + scroll; y < wy1; y += 26) ctx.drawImage(S.fall, wx, y);
    ctx.restore();
    ctx.fillStyle = '#e8f4ff';                                     // animated foam checker
    const ph = (t * 0.02) | 0;
    for (let x = wx - 2; x < wx + S.fallW + 2; x++)
      for (let y = wy1; y < wy1 + 5; y++)
        if (((x + y + ph) & 1) === 0) ctx.fillRect(x, y, 1, 1);
    ctx.drawImage(S.panel, 0, 0);                                  // static patterns
    for (let i = 0; i < 3; i++) {                                  // marching sprites, 1:1 px
      const sx = Math.round(fract(t * 0.00006 + i / 3) * (w + 16)) - 8;
      ctx.drawImage(S.sprite[(((t / 240) | 0) + i) % 2], sx, h - 41);
    }
  }

  // Channel shape: { num: <dial number>, name: <string>, draw(ctx, t, w=320, h=240) } — draw must fill the whole frame.
  // static: true → one frame, then the wrapper reports "nothing new"
  // and the renderer's scheduler parks itself (fps: idle on the bench).
  const CHANNELS = [
    { num: 2, name: 'SMPTE BARS', draw: drawSmpteBars, static: true },
    { num: 3, name: 'CROSSHATCH', draw: drawCrosshatch, static: true },
    { num: 4, name: 'TEST CARD',  draw: drawTestCard,  static: true },
    { num: 5, name: 'MOTION',     draw: drawMotionReel, static: false },
    { num: 6, name: 'SNOW',       draw: drawSnow,       static: false },
    { num: 7, name: 'DITHER',     draw: drawDither,     static: false },
  ];

  let channelIdx = 0;
  let channelSwitchWall = -Infinity;          // performance.now() of last switch (-Infinity = no interstitial pending)
  let staticPainted = false;                  // current static channel already delivered its one frame
  function paintChannel(ctx, t, needsRepaint) {
    if (needsRepaint) staticPainted = false;  // renderer lost our pixels (context restore)
    if (performance.now() - channelSwitchWall < 150) {
      staticPainted = false;                  // snow ends with one fresh paint of the channel
      drawSnow(ctx, t, SIGNAL_W, SIGNAL_H);
      return true;
    }
    const ch = CHANNELS[channelIdx];
    if (ch.static && staticPainted) return false;   // scheduler contract: nothing new
    ch.draw(ctx, t, SIGNAL_W, SIGNAL_H);
    staticPainted = !!ch.static;
    return true;
  }

  // --- Renderer lifecycle --------------------------------------------
  const glCanvas = document.getElementById('crt');
  const byCanvas = document.getElementById('bypass');
  const bctx = byCanvas.getContext('2d');
  const off = document.createElement('canvas');
  off.width = SIGNAL_W; off.height = SIGNAL_H;
  const octx = off.getContext('2d');

  let renderer = null;          // live Trinitron|ShadowMask or null
  let rendererIdx = 0;
  let webglOk = true;
  let bypassRaf = null, bypassStart = 0;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  // Boot from the classes' own tuned `tv` presets — the bench exists to
  // retune them, and "copy state diff" output gets transferred back
  // into the preset objects in the renderer files. The frozen preset's
  // convergence/effects are cloned so bench mutations never write into
  // the shared template.
  function makeRenderer(kind) {
    const Cls = kind === 'trinitron' ? window.Trinitron : window.ShadowMask;
    const P = Cls.presets.tv;
    return new Cls(glCanvas, Object.assign({}, P, {
      signal: paintChannel,
      viewSize: [SIGNAL_W, SIGNAL_H],
      canvasSize: [640, 480],                  // fixed display; backing maps 1:1 to physical px
      stripeUpscale: 640 / SIGNAL_W,           // 2 at res 320 (preset), 1 at res 640
      debugOverlay: false,
      convergence: {
        r: [...P.convergence.r], g: [...P.convergence.g], b: [...P.convergence.b],
      },
      effects: Object.assign({}, P.effects),
    }));
  }

  function stopBypass() {
    if (bypassRaf != null) { cancelAnimationFrame(bypassRaf); bypassRaf = null; }
  }
  function bypassTick(now) {
    const dirty = paintChannel(octx, now - bypassStart);
    if (dirty) {
      bctx.imageSmoothingEnabled = false;
      bctx.drawImage(off, 0, 0, byCanvas.width, byCanvas.height);
    }
    // Bypass has no persistence to settle: park as soon as the channel
    // reports static (snow interstitials always report dirty; the wake
    // path is setChannel/setRenderer restarting the loop).
    if (!reducedMotion.matches && dirty) bypassRaf = requestAnimationFrame(bypassTick);
    else bypassRaf = null;
  }
  function startBypass() {
    bypassStart = performance.now();
    bypassTick(bypassStart);    // reduced-motion → exactly one frame
  }
  // The renderers re-handle reduced-motion changes themselves; mirror
  // that for bypass (restart resumes the loop or renders one fresh frame).
  const bypassMotionHandler = () => { if (!byCanvas.hidden) { stopBypass(); startBypass(); } };
  if (reducedMotion.addEventListener) reducedMotion.addEventListener('change', bypassMotionHandler);
  else if (reducedMotion.addListener) reducedMotion.addListener(bypassMotionHandler);

  function setRenderer(idx) {
    rendererIdx = idx;
    staticPainted = false;      // new output device needs a fresh paint
    const kind = RENDERERS[idx];
    if (renderer) { try { renderer.destroy(); } catch (_) {} renderer = null; window.__crt = null; }
    stopBypass();
    const useBypass = kind === 'bypass' || !webglOk;
    if (!useBypass) {
      try {
        renderer = makeRenderer(kind);
        window.__crt = renderer;
        renderer.start();
      } catch (err) {
        console.warn('[tv] renderer init failed, bypass fallback:', err);
        // reset any half-constructed renderer (e.g. start() threw mid-frame)
        if (renderer) { try { renderer.destroy(); } catch (_) {} renderer = null; window.__crt = null; }
        // Latch the permanent fallback only on genuine WebGL2/extension
        // absence (the constructors' "… unavailable" throws). Any other
        // throw — say, a shader edit mid-tuning — falls to bypass for
        // this position but leaves the other knob positions retryable.
        if (/unavailable/i.test((err && err.message) || '')) {
          webglOk = false;
          const knob = document.getElementById('knob-renderer');
          knob.disabled = true;
          knob.title = 'WebGL2 unavailable — bypass only';
        }
      }
    }
    const inBypass = !renderer;
    glCanvas.hidden = inBypass;
    byCanvas.hidden = !inBypass;
    if (inBypass) startBypass();
    document.body.dataset.power = inBypass ? 'bypass' : 'on';
    rebuildBench();
    updateReadout();
    // RENDERER: 3 positions over -60°..+60°
    knobRenderer.style.setProperty('--angle', (-60 + rendererIdx * 60) + 'deg');
    syncUrl();
  }

  function setChannel(idx) {
    channelIdx = idx;
    staticPainted = false;
    if (reducedMotion.matches) {
      // no snow interstitial; repaint exactly one frame of the new channel
      channelSwitchWall = -Infinity;
      if (renderer) renderer.start();
      else { stopBypass(); startBypass(); }
    } else {
      channelSwitchWall = performance.now();
      // wake a parked renderer (or bypass loop) for the interstitial
      if (renderer) renderer.requestRender();
      else { stopBypass(); startBypass(); }
    }
    updateReadout();
    // CHANNEL: dial paints positions 2–7 over -120°..+120° (48° steps);
    // point at the painted position for this channel's number.
    knobChannel.style.setProperty('--angle', (-120 + (CHANNELS[channelIdx].num - 2) * 48) + 'deg');
    syncUrl();
  }

  // --- Bench (schema-driven parameter panel) ---------------------------
  let benchFpsEl = null;
  function rebuildBench() {
    const bench = document.getElementById('bench');
    bench.textContent = '';
    if (!renderer) {
      benchFpsEl = null;        // don't retain the previous bench's span
      const note = document.createElement('p');
      note.className = 'bench-note';
      note.textContent = 'BYPASS — raw signal, no renderer active.';
      bench.appendChild(note);
      return;
    }
    const head = document.createElement('div');
    head.className = 'bench-head';
    const title = document.createElement('h2');
    title.textContent = `${RENDERERS[rendererIdx].replace('-', ' ')} parameters`;
    head.appendChild(title);
    const fps = document.createElement('span');
    fps.className = 'bench-fps';
    fps.textContent = 'fps: --';
    head.appendChild(fps);
    benchFpsEl = fps;
    const copy = document.createElement('button');
    copy.className = 'bench-copy';
    copy.textContent = 'copy state diff';
    copy.addEventListener('click', async () => {
      const text = renderer.stateDiff();
      try { await navigator.clipboard.writeText(text); copy.textContent = 'copied'; }
      catch (_) { console.log('[tv]\n' + text); copy.textContent = 'see console'; }
      setTimeout(() => { copy.textContent = 'copy state diff'; }, 1400);
    });
    head.appendChild(copy);
    bench.appendChild(head);

    for (const group of renderer.constructor.effectSchema) {
      const fs = document.createElement('fieldset');
      fs.className = 'bench-group';
      const lg = document.createElement('legend');
      lg.textContent = group.title;
      fs.appendChild(lg);
      for (const item of group.items) {
        const block = document.createElement('div');
        block.className = 'bench-item';
        const row = document.createElement('label');
        row.className = 'bench-toggle';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = !!renderer.effects[item.key];
        cb.addEventListener('change', () => { renderer.effects[item.key] = cb.checked; renderer.requestRender(); });
        row.appendChild(cb);
        const name = document.createElement('span');
        name.textContent = item.label;
        row.appendChild(name);
        row.appendChild(makeBadge(item.scope));
        block.appendChild(row);
        const desc = document.createElement('p');
        desc.className = 'bench-desc';
        desc.textContent = item.desc;
        block.appendChild(desc);
        for (const p of (item.params || [])) {
          const prow = document.createElement('div');
          prow.className = 'bench-param';
          const sub = document.createElement('span');
          sub.textContent = p.sub;
          prow.appendChild(sub);
          const slider = document.createElement('input');
          slider.type = 'range';
          slider.min = String(p.min); slider.max = String(p.max); slider.step = String(p.step);
          const val = document.createElement('output');
          const fmt = (v) => v.toFixed(Math.max(0, -Math.floor(Math.log10(p.step))));
          const init = renderer.readParam(p.opt);
          slider.value = String(init);
          val.textContent = fmt(init);
          slider.addEventListener('input', () => {
            const v = parseFloat(slider.value);
            val.textContent = fmt(v);
            renderer.writeParam(p.opt, v);
          });
          prow.appendChild(slider);
          prow.appendChild(val);
          if (p.scope && p.scope !== item.scope) prow.appendChild(makeBadge(p.scope));
          block.appendChild(prow);
        }
        fs.appendChild(block);
      }
      bench.appendChild(fs);
    }
  }
  function makeBadge(scope) {
    const b = document.createElement('span');
    b.className = `badge badge-${scope}`;
    b.textContent = scope;
    return b;
  }

  // --- Knob wiring -----------------------------------------------------
  const knobChannel  = document.getElementById('knob-channel');
  const knobRenderer = document.getElementById('knob-renderer');

  function wireKnob(btn, getCount, getIdx, setIdx) {
    const step = (d) => {
      const count = getCount();   // read at event time — channel list grows later
      setIdx(((getIdx() + d) % count + count) % count);
    };
    btn.addEventListener('click', () => step(1));
    btn.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp')   { e.preventDefault(); step(1); }
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowDown') { e.preventDefault(); step(-1); }
    });
  }

  function updateReadout() {
    const mode = webglOk
      ? RENDERERS[rendererIdx].replace('-', ' ').toUpperCase()
      : 'BYPASS (NO WEBGL2)';
    document.getElementById('readout').textContent =
      `CH ${CHANNELS[channelIdx].num} · ${mode}${SIGNAL_W === 640 ? ' · 640' : ''}`;
  }

  // --- URL state ------------------------------------------------------
  function syncUrl() {
    // In failure-bypass the URL keeps the *requested* renderer rather
    // than 'bypass' — intentional: reloading retries the request.
    const u = new URL(window.location);
    u.searchParams.set('ch', String(CHANNELS[channelIdx].num));
    u.searchParams.set('renderer', RENDERERS[rendererIdx]);
    try { history.replaceState(null, '', u); }
    catch (_) { /* file:// or rate-limited — URL sync is best-effort */ }
  }
  function readUrl() {
    const u = new URL(window.location);
    const ch = parseInt(u.searchParams.get('ch'), 10);
    const ci = CHANNELS.findIndex((c) => c.num === ch);
    if (ci >= 0) channelIdx = ci;
    const ri = RENDERERS.indexOf(u.searchParams.get('renderer'));
    if (ri >= 0) rendererIdx = ri;
  }

  // --- Bench fps meter --------------------------------------------------
  // ~500 ms window over the renderer's frame counter (the renderers'
  // private `_frameCount` — a deliberate cross-file read; the built-in
  // ?debug=1 panels meter the same way). Time-based so timer jitter
  // doesn't skew the reading; reseeds on renderer swap so the first
  // reading after a change isn't a cross-renderer delta.
  let fpsLastRenderer = null, fpsLastFrames = 0, fpsLastTime = 0;
  setInterval(() => {
    if (!renderer || !benchFpsEl) { fpsLastRenderer = null; return; }
    const now = performance.now();
    if (fpsLastRenderer !== renderer) {
      fpsLastRenderer = renderer;
      fpsLastFrames = renderer._frameCount;
      fpsLastTime = now;
      return;
    }
    const delta = renderer._frameCount - fpsLastFrames;
    const dt = now - fpsLastTime;
    fpsLastFrames = renderer._frameCount;
    fpsLastTime = now;
    if (dt > 0) {
      // _mode is a deliberate cross-file private read, like _frameCount.
      benchFpsEl.textContent = renderer._mode === 'idle'
        ? 'fps: idle'
        : `fps: ${Math.round(delta * 1000 / dt)}`;
    }
  }, 500);

  // --- Boot -----------------------------------------------------------
  readUrl();
  wireKnob(knobChannel,  () => CHANNELS.length,  () => channelIdx,  setChannel);
  wireKnob(knobRenderer, () => RENDERERS.length, () => rendererIdx, setRenderer);
  setRenderer(rendererIdx);
  setChannel(channelIdx);
})();
</script>
</body>
</html>

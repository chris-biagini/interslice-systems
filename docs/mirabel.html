<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIRABEL — CRT playback test · Interslice Systems</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* Service-bay page: pinned dark (data-theme="dark" on <html>) because
     the phosphor renderers ARE the dark medium — there is no paper
     version of this page. tokens.css supplies the navy/cream palette. */
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); }
  *, *::before, *::after { box-sizing: border-box; }

  .lab {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 24px 40px;
    gap: 26px;
  }

  /* ===================== TOP BAR ===================== */
  /* Left-clustered on purpose: the renderers' adjustment panel mounts
     fixed in the top-right corner, so nothing interactive lives there. */
  .bar {
    width: 100%;
    max-width: 1100px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 28px;
    flex-wrap: wrap;
  }
  .home {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--fg-muted);
    text-decoration: none;
  }
  .home:hover, .home:focus-visible { color: var(--ink-cyan); }
  .bar h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.02em;
  }
  .bar h1 .partno {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--fg-muted);
    display: block;
    margin-bottom: 2px;
    text-transform: uppercase;
  }

  /* ===================== RENDERER TOGGLE ===================== */
  .toggle {
    display: inline-flex;
    border: 1px solid var(--navy-2);
    border-radius: 6px;
    overflow: hidden;
  }
  .toggle button {
    appearance: none;
    border: 0;
    margin: 0;
    padding: 8px 14px;
    background: var(--navy-1);
    color: var(--fg-muted);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .toggle button + button { border-left: 1px solid var(--navy-2); }
  .toggle button:hover { color: var(--fg); }
  .toggle button[aria-pressed="true"] {
    background: var(--navy-2);
    color: var(--ink-cyan);
    text-shadow: 0 0 8px color-mix(in srgb, var(--ink-cyan) 60%, transparent);
  }

  /* ===================== THE SET ===================== */
  .cabinet {
    margin: 0;
    background: var(--navy-1);
    border: 1px solid var(--navy-2);
    border-radius: 16px;
    padding: 20px 20px 14px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
  }
  .screen-slot {
    border-radius: 8px;
    overflow: hidden;
    background: #000;
    line-height: 0; /* no inline-gap below the canvas */
  }
  canvas.crt-screen { display: block; }
  .screen-slot video.promoted { display: block; width: 100%; height: auto; }

  /* Bezel plate. The toggle lives here (bottom-left of the cabinet,
     like a PVM input selector) — never under the fixed panel's corner.
     width:0 + min-width:100% keeps the plate's content from propping
     the cabinet open wider than the screen (portrait crops are
     narrower than the toggle + label row); the plate wraps instead. */
  .plate {
    width: 0;
    min-width: 100%;
    margin-top: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }
  .plate .mode { color: var(--ink-magenta); font-style: normal; }

  /* ===================== SOURCE REFERENCE ===================== */
  .source {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .source video {
    display: block;
    width: 224px;
    border-radius: 4px;
    border: 1px solid var(--navy-2);
  }
  .source .label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fg-muted);
  }

  /* WebGL2-unavailable fallback: the source video is promoted into the
     screen slot by the script; hide the now-redundant reference block. */
  html.crt-failed .source { display: none; }
</style>
</head>
<body>
<div class="lab">

  <header class="bar">
    <a class="home" href="./">&larr; interslice&middot;systems</a>
    <h1><span class="partno">Interslice Systems &middot; Service Division</span>MIRABEL &mdash; Playback Test</h1>
  </header>

  <figure class="cabinet">
    <div class="screen-slot">
      <canvas class="crt-screen"></canvas>
    </div>
    <figcaption class="plate">
      <div class="toggle" role="group" aria-label="CRT renderer">
        <button type="button" data-renderer="trinitron" aria-pressed="true">Trinitron</button>
        <button type="button" data-renderer="shadow-mask" aria-pressed="false">Shadow Mask</button>
      </div>
      <span>PVM-2738 &middot; composite in &middot; <em class="mode">service mode &mdash; adjustments at right</em></span>
    </figcaption>
  </figure>

  <aside class="source">
    <!-- Re-encoded from the portrait master (~/Videos/mirabel.mp4):
         scaled + fps-halved for the corner-assistant use, audio
         stripped (autoplay is muted anyway). mp4, not .mov — Firefox
         refuses the QuickTime container outright. -->
    <video id="source-video" src="mirabel.mp4" muted loop autoplay playsinline preload="auto"></video>
    <div class="label">Source &middot; mirabel.mp4 &middot; 216&times;384 &middot; 12 fps &middot; H.264 &middot; 87 KB</div>
  </aside>

</div>

<script src="trinitron.js"></script>
<script src="shadow-mask.js"></script>
<script>
(function () {
  'use strict';

  // The renderers build their own adjustment panel when the URL carries
  // ?debug=1 (and debugOverlay:true). This page wants the panel always,
  // so pin the param into the URL before any construction — the panel
  // code stays where it lives, in the renderer files.
  function patchUrl(mutate) {
    try {
      const u = new URL(window.location);
      mutate(u.searchParams);
      history.replaceState(null, '', u);
    } catch (_) { /* file:// edge cases — page still works, panel may not */ }
  }
  patchUrl((p) => { if (p.get('debug') !== '1') p.set('debug', '1'); });

  const video   = document.getElementById('source-video');
  const canvas  = document.querySelector('canvas.crt-screen');
  const lab     = document.querySelector('.lab');
  const buttons = Array.from(document.querySelectorAll('.toggle button'));
  if (!video || !canvas || !window.Trinitron || !window.ShadowMask) return;

  let crt  = null;
  let view = [0, 0];
  // Content rect within the video frame, in video pixels — null until
  // detectCrop() runs (or if it bails). mirabel.mov ships with its
  // pillarbox bars baked into the encoded frames; this carves them off.
  let cropRect = null;

  function currentKind() {
    try {
      return new URL(window.location).searchParams.get('crt') === 'shadow-mask'
        ? 'shadow-mask' : 'trinitron';
    } catch (_) { return 'trinitron'; }
  }

  // Scan the current video frame for the non-black content bounds.
  // Samples every other pixel; a row/column counts as content when any
  // sampled channel clears the threshold (encode-black bars sit well
  // under it, real shadows well over). Returns null when there's
  // nothing to crop — degenerate bounds (a black frame) or bars too
  // thin to matter.
  function detectCrop() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;
    const probe = document.createElement('canvas');
    probe.width = vw; probe.height = vh;
    const pctx = probe.getContext('2d', { willReadFrequently: true });
    pctx.drawImage(video, 0, 0);
    let data;
    try { data = pctx.getImageData(0, 0, vw, vh).data; } catch (_) { return null; }
    const T = 24;
    const colHas = new Uint8Array(vw), rowHas = new Uint8Array(vh);
    for (let y = 0; y < vh; y += 2) {
      const rowBase = y * vw * 4;
      for (let x = 0; x < vw; x += 2) {
        const i = rowBase + x * 4;
        if (data[i] > T || data[i + 1] > T || data[i + 2] > T) {
          colHas[x] = 1; rowHas[y] = 1;
        }
      }
    }
    let x0 = 0;      while (x0 < vw && !colHas[x0]) x0++;
    let x1 = vw - 1; while (x1 > 0  && !colHas[x1]) x1--;
    let y0 = 0;      while (y0 < vh && !rowHas[y0]) y0++;
    let y1 = vh - 1; while (y1 > 0  && !rowHas[y1]) y1--;
    if (x1 - x0 < vw * 0.15 || y1 - y0 < vh * 0.15) return null;
    // Shave 2px of soft bar-edge fringe; skip the crop entirely if the
    // bars are within 8px of the frame edge (nothing worth cropping).
    x0 += 2; y0 += 2; x1 -= 2; y1 -= 2;
    if (x0 <= 8 && y0 <= 8 && x1 >= vw - 9 && y1 >= vh - 9) return null;
    return { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
  }

  // Signal callback: black CRT face, then the cropped region of the
  // current video frame, contain-fit (the screen is sized to the crop's
  // aspect, so normally this fills edge to edge). Everything CRT-ish
  // happens downstream in the GPU passes.
  function signal(ctx) {
    const w = view[0], h = view[1];
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, w, h);
    if (video.readyState < 2 || !video.videoWidth) return;
    const c = cropRect || { x: 0, y: 0, w: video.videoWidth, h: video.videoHeight };
    const va = c.w / c.h;
    let dw = w, dh = h;
    if (va > w / h) dh = w / va; else dw = h * va;
    ctx.drawImage(video, c.x, c.y, c.w, c.h, (w - dw) / 2, (h - dh) / 2, dw, dh);
  }

  // Screen size: the cropped content's aspect at 1 source px = 1 display
  // px, fit inside a box capped by width (so the renderer's fixed panel
  // has somewhere to float) and by height (portrait content would
  // otherwise blow past the viewport).
  function measure() {
    const c = cropRect;
    const aspect = c ? c.w / c.h
      : (video.videoWidth ? video.videoWidth / video.videoHeight : 16 / 9);
    const maxW = Math.max(280, Math.min(960, Math.round(lab.clientWidth - 88)));
    const maxH = Math.max(240, Math.round(window.innerHeight * 0.74));
    let w = maxW, h = Math.round(w / aspect);
    if (h > maxH) { h = maxH; w = Math.round(h * aspect); }
    return [w, h];
  }

  // Drop the CRT and run the raw video in the screen slot instead.
  // Reached when WebGL2 is missing, or when the canvas is origin-tainted
  // (file:// pages: the video counts as cross-origin, so the per-frame
  // texImage2D upload of the signal canvas would throw forever).
  function fallbackToRawVideo(reason) {
    document.documentElement.classList.add('crt-failed');
    canvas.remove();
    video.classList.add('promoted');
    document.querySelector('.screen-slot').appendChild(video);
    if (reason) console.warn('[mirabel] CRT disabled: ' + reason);
  }

  // True if a canvas that has the video drawn into it can still be read
  // back — i.e. the renderer will be able to upload it to the GPU.
  // Inconclusive (no frame yet) counts as usable.
  function signalSourceUsable() {
    if (video.readyState < 2 || !video.videoWidth) return true;
    const probe = document.createElement('canvas');
    probe.width = 2; probe.height = 2;
    const pctx = probe.getContext('2d');
    pctx.drawImage(video, 0, 0, 2, 2);
    try { pctx.getImageData(0, 0, 1, 1); return true; } catch (_) { return false; }
  }

  function build(kind, size) {
    if (document.documentElement.classList.contains('crt-failed')) return;
    if (crt) {
      try { crt.destroy(); } catch (_) { /* defensive */ }
      crt = null;
    }
    if (!signalSourceUsable()) {
      fallbackToRawVideo('canvas is origin-tainted by the video — serve the page over http(s) (e.g. python3 -m http.server -d docs 8000) for the phosphor path.');
      return;
    }
    view = size;
    const w = size[0], h = size[1];
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';

    // Hero-screen options, minus the logo-specific bits. Per-class
    // values mirror createTrinitron() in index.html so the two pages
    // stay one tuning pass apart, not two.
    const common = {
      signal,
      viewSize:   [w, h],
      canvasSize: [w * 2, h * 2],
      stripeUpscale: 2,
      opaqueBackground: true,
      phosphorCoupling: 0.35,
      persistence: 0.82,
      convergence: { r: [-0.25, -0.25], g: [0, 0], b: [0.25, 0.25] },
      rowShimmer: 0.02,
      bloomStrength: 1.2,
      debugOverlay: true,
    };

    try {
      if (kind === 'shadow-mask') {
        crt = new window.ShadowMask(canvas, Object.assign(common, {
          cellSize: [3, 3],
          beamSpreadPx: 1.5,
          beamSpreadVerticalPx: 1.5,
          bleedRadius: 24,
          bloomThreshold: 0.3,
          dotRadius: 0.7,
        }));
      } else {
        crt = new window.Trinitron(canvas, Object.assign(common, {
          cellSize: 3,
          beamSpreadPx: 0.7,
          beamSpreadVerticalPx: 1.4,
          damperStrength: 0.90,
          bleedRadius: 18,
          gapMaskAlpha: 0.15,
          gapMaskPeriod: 2,
          effects: { gapMask: true },
        }));
      }
      window.__crt = crt;
      window.__trinitronLogo = (kind === 'trinitron') ? crt : undefined;
      crt.start();
    } catch (err) {
      fallbackToRawVideo('WebGL2 (or a required float extension) unavailable — ' + err.message);
    }

    for (const b of buttons) {
      b.setAttribute('aria-pressed', String(b.dataset.renderer === kind));
    }
    // Muted autoplay is near-universally allowed, but if a policy blocked
    // it, any toggle click retries from a user gesture.
    const p = video.play();
    if (p && p.catch) p.catch(() => {});
  }

  for (const b of buttons) {
    b.addEventListener('click', () => {
      const kind = b.dataset.renderer;
      if (kind === currentKind() && crt) return;
      patchUrl((params) => {
        if (kind === 'shadow-mask') params.set('crt', 'shadow-mask');
        else params.delete('crt');
      });
      build(kind, measure());
    });
  }

  // Debounced rebuild on resize, same rhythm as the hero screen —
  // recreating a renderer rebuilds the whole GL pipeline (~20 ms).
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const size = measure();
      if (crt && size[0] === view[0] && size[1] === view[1]) return;
      build(currentKind(), size);
    }, 200);
  });

  // Startup: detect the crop before the first build so the screen is
  // born at the content's aspect. Seek to a mid-clip frame first —
  // frame zero of a fade-in is all black and would defeat detection —
  // then rewind and play. Failsafes (timeout, video error) build at
  // the uncropped default so the page never sits dead.
  let built = false;
  function buildOnce() {
    if (built) return;
    built = true;
    build(currentKind(), measure());
  }
  const failsafe = setTimeout(buildOnce, 2500);
  video.addEventListener('error', () => { clearTimeout(failsafe); buildOnce(); }, { once: true });

  function sampleAndBuild() {
    cropRect = detectCrop();
    window.__cropRect = cropRect; // DevTools handle, same spirit as __crt
    clearTimeout(failsafe);
    try { video.currentTime = 0; } catch (_) { /* keep playing from here */ }
    const p = video.play();
    if (p && p.catch) p.catch(() => {});
    buildOnce();
  }
  function seekThenSample() {
    const t = Math.min(2, (video.duration || 0) / 2);
    if (!t || video.currentTime > t) { sampleAndBuild(); return; }
    video.addEventListener('seeked', sampleAndBuild, { once: true });
    try { video.currentTime = t; } catch (_) { sampleAndBuild(); }
  }
  if (video.readyState >= 1) seekThenSample();
  else video.addEventListener('loadedmetadata', seekThenSample, { once: true });
})();
</script>
</body>
</html>

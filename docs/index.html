<script>
(function () {
  'use strict';

  function isDark() {
    const t = document.documentElement.dataset.theme;
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  // Serialize a fragment (the arms or hub group) into a standalone SVG document,
  // wrap it in a blob URL, and resolve to a loaded HTMLImageElement.
  function rasterizeFragment(fragmentMarkup) {
    const doc = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">${fragmentMarkup}</svg>`;
    const blob = new Blob([doc], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }

  // Rasterize a live SVG element to an HTMLImageElement, with the
  // dark-mode form baked in: `.paper-only` groups are stripped, computed
  // `color` and `font-family` are inlined on the root so `currentColor`
  // and `<text>` elements resolve correctly in the standalone SVG (no
  // page CSS reaches the blob document). The .sprinkle class is
  // dropped from the clone — that class carries page-positioning rules
  // we don't want; the canvas applies positioning + rotation itself.
  function rasterizeSvgElement(svgElement) {
    const clone = svgElement.cloneNode(true);
    clone.querySelectorAll('.paper-only').forEach(g => g.remove());
    const style = window.getComputedStyle(svgElement);
    const inlineStyle = `color: ${style.color}; font-family: ${style.fontFamily}`;
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    const existing = clone.getAttribute('style');
    clone.setAttribute('style', existing ? `${existing}; ${inlineStyle}` : inlineStyle);
    clone.removeAttribute('class');
    const doc = clone.outerHTML;
    const blob = new Blob([doc], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }

  // Extract the rotation angle (radians) from an element's computed
  // CSS transform. Used so the canvas paint matches the live sprinkle's
  // rotation. Returns 0 for `none` or unparseable matrices.
  function getRotationRad(element) {
    const t = window.getComputedStyle(element).transform;
    if (!t || t === 'none') return 0;
    const m = t.match(/matrix\(([-\d.,\s]+)\)/);
    if (!m) return 0;
    const parts = m[1].split(',').map(parseFloat);
    return Math.atan2(parts[1], parts[0]);
  }

  // Markup for the two phosphor source groups. Kept inline so the script
  // is self-contained. Colors are pure RGB (lobes #FF0000/#00FF00/#0000FF)
  // and pure additive secondaries (overlaps #FFFF00/#FF00FF/#00FFFF) —
  // intentionally distinct from tokens.css's CMYK --ink-* palette so the
  // Trinitron stripe decomposition reads as authentically additive.
  const ARMS_MARKUP = `
    <g fill="none" stroke-width="24" stroke-linecap="round">
      <line x1="100" y1="100" x2="100"    y2="28"  stroke="#FF0000"/>
      <line x1="100" y1="100" x2="37.65"  y2="136" stroke="#00FF00"/>
      <line x1="100" y1="100" x2="162.35" y2="136" stroke="#0000FF"/>
    </g>
    <circle cx="100"    cy="28"  r="24" fill="#FF0000"/>
    <circle cx="37.65"  cy="136" r="24" fill="#00FF00"/>
    <circle cx="162.35" cy="136" r="24" fill="#0000FF"/>`;

  const HUB_MARKUP = `
    <path d="M 100 100 Q 114.736 88.487 134 100 A 34 34 0 0 0 117 70.555 Q 97.397 81.482 100 100 Z" fill="#FF00FF"/>
    <path d="M 100 100 Q 97.397 81.482 117 70.555 A 34 34 0 0 0 83 70.555 Q 82.662 92.995 100 100 Z" fill="#FF0000"/>
    <path d="M 100 100 Q 82.662 92.995 83 70.555 A 34 34 0 0 0 66 100 Q 85.264 111.513 100 100 Z" fill="#FFFF00"/>
    <path d="M 100 100 Q 85.264 111.513 66 100 A 34 34 0 0 0 83 129.445 Q 102.603 118.518 100 100 Z" fill="#00FF00"/>
    <path d="M 100 100 Q 102.603 118.518 83 129.445 A 34 34 0 0 0 117 129.445 Q 117.338 107.005 100 100 Z" fill="#00FFFF"/>
    <path d="M 100 100 Q 117.338 107.005 117 129.445 A 34 34 0 0 0 134 100 Q 114.736 88.487 100 100 Z" fill="#0000FF"/>`;

  // Aqua-style gloss for the displayed image — three layered effects per
  // lobe (three pinwheel-tip balls + central hub disc), composited into
  // the signal so they go through cell sampling, stripe render,
  // persistence, halo, and scan-band along with the colored phosphor:
  //   1. Inner glow — soft hazy rim, lobe reads as translucent gel.
  //   2. Top specular shine — dome highlight, the crisp overhead reflection.
  //   3. Bottom wet-bead reflection — thin highlight, "freshly licked."
  // Source-atop in the signal callback clips them to the bubble
  // silhouette so the straight arms between balls stay as glass tubes.
  const AQUA_MARKUP = `
    <defs>
      <linearGradient id="aTop" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.95"/>
        <stop offset="55%"  stop-color="#FFFFFF" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="aBot" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset="70%"  stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      </linearGradient>
      <radialGradient id="aGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset="60%"  stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset="88%"  stop-color="#FFFFFF" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      </radialGradient>
    </defs>

    <!-- Inner glow per lobe (drawn first, behind specular shines) -->
    <circle cx="100"    cy="28"  r="24" fill="url(#aGlow)"/>
    <circle cx="37.65"  cy="136" r="24" fill="url(#aGlow)"/>
    <circle cx="162.35" cy="136" r="24" fill="url(#aGlow)"/>
    <circle cx="100"    cy="100" r="34" fill="url(#aGlow)"/>

    <!-- Top specular shine: dome highlight in upper portion of each lobe -->
    <ellipse cx="100"    cy="21"  rx="17" ry="11" fill="url(#aTop)"/>
    <ellipse cx="37.65"  cy="129" rx="17" ry="11" fill="url(#aTop)"/>
    <ellipse cx="162.35" cy="129" rx="17" ry="11" fill="url(#aTop)"/>
    <ellipse cx="100"    cy="89"  rx="24" ry="15" fill="url(#aTop)"/>

    <!-- Bottom wet-bead reflection: thin highlight at lobe bottom -->
    <ellipse cx="100"    cy="46"  rx="13" ry="4" fill="url(#aBot)"/>
    <ellipse cx="37.65"  cy="154" rx="13" ry="4" fill="url(#aBot)"/>
    <ellipse cx="162.35" cy="154" rx="13" ry="4" fill="url(#aBot)"/>
    <ellipse cx="100"    cy="125" rx="18" ry="5" fill="url(#aBot)"/>`;

  // Rotation: 36 seconds for 360°, reverse direction — matches the SVG's
  // @keyframes hub-spin + .hub-segs animation, which drive the no-JS
  // fallback. Keep in sync if you ever retune the period.
  const ROT_PERIOD_MS = 36 * 1000;
  function hubAngleDeg(timeMs) {
    return -(timeMs / ROT_PERIOD_MS) * 360;
  }

  // Hero screen visual constants. Geometry (canvas size, logo size,
  // wordmark size/position) is now read from the live DOM per resize
  // by readLayout() inside init() — these constants are the ones that
  // don't depend on the live layout.

  // CRT substrate — visually matches --bg (--navy-0 = #000926) AFTER
  // the phosphor pipeline. Naively painting #000926 makes the screen
  // read maybe a third as bright as the page bg: the aperture-grille
  // stripe decomposition only lights cells at their primary channel
  // (with `phosphorCoupling: 0.35` letting others contribute at 35%),
  // and `gapMaskAlpha: 0.3` darkens every other column by 30%, so the
  // perceived average is well below the source. To compensate, feed
  // the pipeline a source navy ~3× brighter on each channel — the
  // pipeline attenuates it back down to roughly --bg out the other
  // end. (Empirically tuned; iterate if the screen and page bg
  // diverge visually.)
  const HERO_SUBSTRATE = '#001456';

  // Halftone dot wash — replicates .page::before's
  // `radial-gradient(--stamp-ink 1.1px, transparent 1.3px)` at
  // background-size 22px, but scaled up so the dots survive the
  // phosphor pipeline. The page-bg dots paint flat at 4.5% opacity;
  // through aperture-grille stripes + cell aggregation + persistence,
  // a 4.5% signal becomes invisible. Radius 1.6 (≈ one phosphor cell
  // at cellSize 4) and 25% opacity give a dot per cell strong enough
  // to read as halftone through the pipeline. Phase-aligned to the
  // page's dot grid at paint time so the pattern is continuous across
  // the screen edge.
  const HERO_DOT_COLOR = 'rgba(244, 241, 234, 0.25)';
  const HERO_DOT_PERIOD = 22;
  const HERO_DOT_RADIUS = 1.6;
  // Page-bg dot is centered in its 22×22 tile (at 11, 11). The
  // canvas paints the same grid, offset so a dot just inside the
  // screen edge follows a dot just outside on the same lattice.
  const HERO_DOT_TILE_CENTER = HERO_DOT_PERIOD / 2;

  // Wordmark phosphor color — pure #FFFFFF so all three phosphor stripes
  // light at max under the wordmark, matching the pure-RGB lobe scheme.
  const HERO_WORDMARK_COLOR = '#FFFFFF';

  // Wordmark font stack — matches the live .wordmark's
  // var(--font-display) (Space Grotesk).
  const HERO_WORDMARK_FONT = '"Space Grotesk", "Hanken Grotesk", system-ui, sans-serif';

  // Wordmark letter-spacing in em units — matches the live .wordmark's
  // letter-spacing: -0.06em. Applied to canvas paints so glyph-internal
  // tracking matches CSS; between-parts spacing comes from each part's
  // own DOM rect, which already encodes the .wordmark i overrides.
  const HERO_WORDMARK_LETTER_SPACING_EM = -0.06;

  // Halo bleed margin around the live brand box, in display px. The
  // canvas extends this many CSS pixels beyond .brand on each side so
  // the phosphor halo isn't truncated at the brand's edge.
  const HERO_HALO_MARGIN_PX = 16;

  // CTA paint colors. The Trinitron pipeline attenuates source colors,
  // so these are chosen brighter than the equivalent CSS-rule colors
  // to land at roughly the same on-screen brightness after phosphor
  // decomposition + persistence + gap mask. Tune if the CTA reads
  // dim against the wordmark.
  //   - LABEL: muted phosphor for the "Visit our new web-site!" caption
  //     and the "Mozilla Firefox recommended" sub-link. Roughly the
  //     dark-mode --fg-muted (#B3BAD0) brightened a touch.
  //   - TEXT: pure-white "mirepoix.recipes" so all three phosphor stripes
  //     light at max (matches wordmark treatment).
  //   - ARROW + MAGENTA stamp: bright pink phosphor; the halo bleed
  //     pass picks this up as the magenta glow that the CSS
  //     drop-shadow filter approximated in plain dark mode.
  //   - RING + BORDER: cream/white that becomes paper-bright phosphor
  //     inside the screen (matches dark-mode --paper-0 stamp-ink).
  const HERO_CTA_LABEL_COLOR  = '#C8CFE3';
  const HERO_CTA_TEXT_COLOR   = '#FFFFFF';
  const HERO_CTA_ARROW_COLOR  = '#FF1493';
  const HERO_CTA_MAGENTA      = '#FF1493';
  const HERO_CTA_RING         = '#F4F1EA';
  const HERO_CTA_BORDER       = '#FFFFFF';
  const HERO_CTA_MONO_FONT    = '"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace';

  // CTA button stamp shadow geometry — mirrors .cta in tokens.css:
  //   box-shadow: 8px 8px 0 0 var(--ink-magenta), 8px 8px 0 5px var(--stamp-ink)
  // At rest: 8px offset, 5px ink ring. On hover: 10px offset (still 5
  // ring). On press: 0/0 (everything collapses under the button).
  const HERO_CTA_STAMP_REST_PX  = 8;
  const HERO_CTA_STAMP_HOVER_PX = 10;
  const HERO_CTA_STAMP_RING_PX  = 5;
  const HERO_CTA_HOVER_TX_PX    = -2;  // .cta:hover { transform: translate(-2px, -2px) }
  const HERO_CTA_PRESS_TX_PX    = 5;   // .cta:active { transform: translate(5px, 5px) }
  const HERO_CTA_BORDER_PX      = 3;   // matches --bw-bold

  // ===== CHANNELS =====
  // The CRT is a multi-channel set. CH1 is the regular programming
  // (logo + wordmark + CTA). CH2 and CH3 are bonus channels painted
  // entirely on the signal canvas — so they go through the same
  // phosphor/persistence/halo/gap-mask pipeline as everything else and
  // pick up the CRT look for free.
  //
  // Adding a fourth channel: extend CHANNEL_LABELS, write a paintChannelN
  // function, add a branch in signal(). The OSD plate and the button
  // wiring already cycle modulo CHANNEL_LABELS.length.
  const CHANNEL_LABELS = ['INTERSLICE', 'DEMO REEL', 'PONG'];

  // On-screen-display notification — the OSD plate that pops up when
  // the channel changes, like a 90s TV's volume/channel overlay. Tucked
  // into the top-right of the screen, fades in fast and out a bit slower.
  const CH_OSD_DURATION_MS = 2200;
  const CH_OSD_FADE_IN_MS  = 220;
  const CH_OSD_FADE_OUT_MS = 480;

  // OSD typography. Space Grotesk gets used because it's already
  // loaded for the wordmark, so the first OSD frame after the very
  // first channel change isn't waiting on a font swap.
  const CH_OSD_FONT_PX     = 13;
  const CH_OSD_FONT_WEIGHT = '700';

  // ===== LASER GRID =====
  // Synthwave perspective floor. Geometry is authored in a 1200×600
  // viewBox space (horizon at y=0, near plane at y=600). The
  // vanishing point sits well above the visible frame so the lines
  // tilt aggressively over the visible height without converging
  // to a single point at the horizon — the visible horizon catches
  // the fan mid-way through its convergence.
  //
  // Two consumers share GRID_LINES:
  //   1. buildGridSvg() — builds the page-level SVG once at init.
  //   2. readLayout() / signal() — per-resize and per-frame, the
  //      same geometry is transformed into canvas-source coords
  //      and drawn into the Trinitron signal so the lines pixelate
  //      through the phosphor pipeline inside the CRT region.

  const GRID_VW    = 1200;
  const GRID_VH    = 600;
  const GRID_VP_X  = GRID_VW / 2;
  const GRID_VP_Y  = -150;
  // K is the fraction of the way from near-plane to VP that y=0
  // (the visible horizon) sits. K=0.8 means lines are caught only
  // 20% through their fan — steep tilt without single-VP convergence.
  const GRID_K     = GRID_VH / (GRID_VH - GRID_VP_Y);

  const GRID_LINES = (function () {
    const out = [];
    // 40 vertical lines, xBottom spread wide enough that
    // steeply-angled rays enter from the sides near the horizon
    // and fill the page corners.
    const VERT_COUNT = 40;
    for (let i = 0; i <= VERT_COUNT; i++) {
      const t = i / VERT_COUNT;
      const xBottom = -2400 + t * 6000;
      const xTop = xBottom * (1 - GRID_K) + GRID_VP_X * GRID_K;
      out.push({ x1: xBottom, y1: GRID_VH, x2: xTop, y2: 0, kind: 'v', opacity: 1 });
    }
    // Horizontal depth lines — y = GRID_VH * (1 − 1/(1+d)). Depths
    // tuned so foreground row spacing ≈ foreground column spacing
    // (~140 px), then compressing geometrically toward the horizon.
    const DEPTHS = [0.020, 0.043, 0.081, 0.154, 0.275, 0.5, 1.0, 2.33, 14];
    for (const d of DEPTHS) {
      const y = GRID_VH * (1 - 1 / (1 + d));
      out.push({
        x1: -400, y1: y, x2: GRID_VW + 400, y2: y, kind: 'h',
        opacity: Math.min(1, d * 2.5),  // fade near-horizon
      });
    }
    // Horizon line — kind 'horizon' so the in-CRT painter can
    // draw it last (on top of the near-horizon vertical cluster)
    // with a thicker, brighter stroke.
    out.push({ x1: -400, y1: 0, x2: GRID_VW + 400, y2: 0, kind: 'horizon', opacity: 1 });
    return out;
  })();

  // In-CRT paint colors. The Trinitron pipeline attenuates source
  // colors heavily (cell sampling × stripe decomposition × gap mask),
  // so the source feed needs to be a noticeable notch brighter than
  // the CSS rgb(0 168 243) used on the page-level SVG to land at the
  // same on-screen brightness through the pipeline.
  const GRID_CRT_COLOR         = '#00C8FF';
  const GRID_CRT_HORIZON_COLOR = '#DCF5FF';

  // Build the page-level SVG once: walks GRID_LINES and appends <line>
  // elements into the .grid-horizontals / .grid-verticals groups. The
  // horizon <line> is already in the source HTML (it's the single
  // visually-distinct element that warranted authored markup); the
  // computed lines all share the .grid-stroke class.
  function buildGridSvg(laserGridEl) {
    const svg = laserGridEl.querySelector('svg');
    if (!svg) return;
    const horizG = svg.querySelector('.grid-horizontals');
    const vertG  = svg.querySelector('.grid-verticals');
    if (!horizG || !vertG) return;
    const SVG_NS = 'http://www.w3.org/2000/svg';
    for (const line of GRID_LINES) {
      if (line.kind === 'horizon') continue;
      const ln = document.createElementNS(SVG_NS, 'line');
      ln.setAttribute('x1', line.x1);
      ln.setAttribute('y1', line.y1);
      ln.setAttribute('x2', line.x2);
      ln.setAttribute('y2', line.y2);
      ln.setAttribute('class', 'grid-stroke');
      if (line.opacity < 1) ln.setAttribute('stroke-opacity', line.opacity);
      if (line.kind === 'h') horizG.appendChild(ln);
      else vertG.appendChild(ln);
    }
  }

  // Runs at DOMContentLoaded, independent of Trinitron. Builds the SVG
  // line content and keeps .laser-grid's `top` pinned to .brand's
  // vertical center on resize / font-load. Even if Trinitron fails to
  // initialize, this gives us the page-level vector grid in dark mode.
  function setupLaserGrid() {
    const lg = document.querySelector('.laser-grid');
    if (!lg) return;
    buildGridSvg(lg);

    const brand = document.querySelector('.brand');
    const page  = document.querySelector('.page');
    if (!brand || !page) return;

    function reposition() {
      const brandRect = brand.getBoundingClientRect();
      const pageRect  = page.getBoundingClientRect();
      const brandCenterY = brandRect.top + brandRect.height / 2 - pageRect.top;
      lg.style.top = brandCenterY + 'px';
    }
    reposition();

    // .brand's box can shift independently of the viewport (font load,
    // glyph reflow). Observe it directly so the horizon tracks the
    // wordmark/CTA vertical center even mid-render.
    const obs = new ResizeObserver(reposition);
    obs.observe(brand);

    // Window resize covers viewport-width changes that reshape the
    // whole grid (.page width feeds into the SVG's horizontal scale).
    let t = null;
    window.addEventListener('resize', () => {
      if (t) clearTimeout(t);
      t = setTimeout(reposition, 100);
    });

    // Font load can shift .brand's height after first paint — repos
    // once they've settled.
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(reposition);
    }
  }

  // ===== CRT text helpers =====
  // Used by readLayout()/signal() to project a live DOM text element into
  // the Trinitron's source canvas. Pairs with the [data-crt-text] /
  // [data-crt-element] CSS attributes — the live element provides the
  // layout box (clickable, in the a11y tree) and these helpers paint a
  // phosphor copy at the same coordinates.

  // Snapshot a text element's position + font for canvas rendering.
  // Returns canvas-source coordinates (relative to .brand top-left,
  // offset by the halo margin M). getBoundingClientRect includes any
  // CSS transforms on the element; callers that need the resting
  // position should only invoke this when the element is at rest
  // (typically true since readLayout runs on resize, not on hover).
  // opts.textTransform: 'uppercase' applies .toUpperCase() to the text
  // (canvas has no text-transform equivalent — has to be done up front).
  function captureCRTTextLayout(element, brandRect, M, opts = {}) {
    const r = element.getBoundingClientRect();
    const st = window.getComputedStyle(element);
    let text = element.textContent || '';
    if (opts.textTransform === 'uppercase') text = text.toUpperCase();
    return {
      x: Math.round(r.left - brandRect.left + M),
      y: Math.round(r.top  - brandRect.top  + M),
      w: Math.round(r.width),
      h: Math.round(r.height),
      text,
      fontPx: parseFloat(st.fontSize),
      letterSpacingPx: parseFloat(st.letterSpacing) || 0,
      weight: st.fontWeight || '400',
    };
  }

  // Paint a captured text layout. Defaults anchor to the top-left of
  // the element's bounding rect (matches how the live text sits when
  // its line-height is ~1). For rect-centered captions pass
  // {align:'center', baseline:'middle'}; pass tx/ty to add hover/press
  // offsets on top of the resting position.
  function paintCRTText(ctx, layout, opts) {
    const {
      fontFamily,
      color,
      align = 'start',
      baseline = 'top',
      tx = 0,
      ty = 0,
      letterSpacingPx = layout.letterSpacingPx,
    } = opts;
    ctx.fillStyle = color;
    ctx.font = `${layout.weight} ${layout.fontPx}px ${fontFamily}`;
    if ('letterSpacing' in ctx) ctx.letterSpacing = letterSpacingPx + 'px';
    ctx.textBaseline = baseline;
    ctx.textAlign = align;
    let x = layout.x + tx;
    let y = layout.y + ty;
    if      (align === 'center') x += layout.w / 2;
    else if (align === 'end')    x += layout.w;
    if      (baseline === 'middle') y += layout.h / 2;
    else if (baseline === 'bottom') y += layout.h;
    ctx.fillText(layout.text, x, y);
    // Reset textAlign so callers writing manual fillText (e.g. the
    // wordmark's per-part x-cursor) don't have to.
    ctx.textAlign = 'start';
  }

  async function init() {
    const canvas = document.querySelector('canvas.hero-screen');
    const brand  = document.querySelector('.brand');
    const mark   = document.querySelector('.mark');
    const wordmark = document.querySelector('.wordmark');
    if (!canvas || !brand || !mark || !wordmark || !window.Trinitron) return;

    // Wrap each top-level child of .wordmark so all three glyph parts
    // (interslice, ·, systems) have queryable bounding rects. Bare
    // text nodes get a transparent <span>; existing element children
    // just get the marker attribute. CSS inherits into the new spans,
    // so visual layout is unchanged. Done once here so readLayout()
    // can use [data-wordmark-part] as a stable selector.
    for (const node of Array.from(wordmark.childNodes)) {
      if (node.nodeType === Node.TEXT_NODE) {
        if (!node.textContent.trim()) continue;
        const span = document.createElement('span');
        span.dataset.wordmarkPart = '';
        span.textContent = node.textContent;
        wordmark.replaceChild(span, node);
      } else if (node.nodeType === Node.ELEMENT_NODE) {
        node.dataset.wordmarkPart = '';
      }
    }

    // CTA elements — optional. If any are missing the CTA paint phase
    // in signal() short-circuits via layout.ctaButton === null.
    const ctaLabel = document.querySelector('.cta-label');
    const ctaEl    = document.querySelector('.cta');
    const ctaSub   = document.querySelector('.cta-sub');
    const ctaText  = ctaEl ? ctaEl.querySelector('b') : null;
    const ctaArrow = ctaEl ? ctaEl.querySelector('.arrow') : null;

    // CSS-driven hover/press transitions apply to the (invisible) live
    // button, not the canvas-painted copy. We track interaction state
    // in JS and lerp toward the targets each frame so the canvas paint
    // visually follows the live element's translate. lerpK ≈ 0.22 gives
    // a ~10-frame settle (~165 ms at 60fps), close to the CSS 140 ms
    // ease-snap. Not bouncy like the real curve, but the press-down
    // and pop-back feel survive.
    let ctaHover = 0, ctaHoverTarget = 0;
    let ctaPress = 0, ctaPressTarget = 0;
    if (ctaEl) {
      ctaEl.addEventListener('mouseenter', () => { ctaHoverTarget = 1; });
      ctaEl.addEventListener('mouseleave', () => { ctaHoverTarget = 0; ctaPressTarget = 0; });
      ctaEl.addEventListener('mousedown',  () => { ctaPressTarget = 1; });
      ctaEl.addEventListener('mouseup',    () => { ctaPressTarget = 0; });
      // Keyboard focus: light up the hover state so a tab-focused CTA
      // gets the same visual lift as a moused-over one.
      ctaEl.addEventListener('focus', () => { ctaHoverTarget = 1; });
      ctaEl.addEventListener('blur',  () => { ctaHoverTarget = 0; ctaPressTarget = 0; });
      // Touch: treat tap-start as press+hover, tap-end as release.
      ctaEl.addEventListener('touchstart', () => {
        ctaHoverTarget = 1; ctaPressTarget = 1;
      }, { passive: true });
      const touchEnd = () => {
        ctaPressTarget = 0;
        setTimeout(() => { ctaHoverTarget = 0; }, 120);
      };
      ctaEl.addEventListener('touchend',    touchEnd);
      ctaEl.addEventListener('touchcancel', touchEnd);
    }

    let armsImg, hubImg, aquaImg;
    try {
      [armsImg, hubImg, aquaImg] = await Promise.all([
        rasterizeFragment(ARMS_MARKUP),
        rasterizeFragment(HUB_MARKUP),
        rasterizeFragment(AQUA_MARKUP),
      ]);
    } catch (err) {
      return; // Fall back to SVG implementation
    }

    // SVG sprinkles: rasterize each once at startup (markup doesn't
    // change). At paint time we walk this list and draw any that
    // intersect the canvas region, so the sprinkles read as continuous
    // across the screen edge — paper sticker outside, phosphor inside.
    const svgSprinkles = Array.from(document.querySelectorAll('svg.sprinkle'));
    const sprinkleImages = new Map(); // Element → HTMLImageElement
    await Promise.all(svgSprinkles.map(async (spr) => {
      try {
        sprinkleImages.set(spr, await rasterizeSvgElement(spr));
      } catch (_) { /* skip individual failures; sprinkle just doesn't appear in canvas */ }
    }));

    // Wait for Space Grotesk to be loaded — measureText returns metrics
    // for whatever font ctx.font resolves to, so a fallback like
    // system-ui would produce wrong centering. document.fonts.load
    // primes the font cache at one specific size; any other size we
    // use after this resolves the same font face.
    if (document.fonts && document.fonts.load) {
      try {
        await Promise.all([
          document.fonts.load('700 124px "Space Grotesk"'),
          // JetBrains Mono — the .cta-label and .cta-sub captions paint
          // into the CRT using this face. Without priming, the first
          // signal frame measures against a fallback mono and the
          // caption centering drifts on the second frame.
          document.fonts.load('700 11px "JetBrains Mono"'),
        ]);
      } catch (_) { /* fall through; we'll use whatever's available */ }
    }

    // Position the canvas so the halo can extend beyond the .brand
    // bounding box without being clipped at the screen edge.
    canvas.style.top    = `${-HERO_HALO_MARGIN_PX}px`;
    canvas.style.left   = `${-HERO_HALO_MARGIN_PX}px`;
    canvas.style.width  = `calc(100% + ${2 * HERO_HALO_MARGIN_PX}px)`;
    canvas.style.height = `calc(100% + ${2 * HERO_HALO_MARGIN_PX}px)`;

    // Reusable offscreen canvas for the logo composite (resized as the
    // live .mark resizes).
    const logoCanvas = document.createElement('canvas');
    const logoCtx = logoCanvas.getContext('2d');

    let layout = null;
    let trinitron = null;

    // ===== CHANNEL STATE =====
    // The current channel (0-indexed; user-facing labels add 1). The
    // signal() callback branches on this each frame. Persists across
    // theme toggles (channel choice survives going to light mode and back).
    let currentChannel = 0;

    // Per-channel runtime state. Each channel resets its state when first
    // entered after a layout change (initialized = false on layout swap)
    // so positions land in the new screen rect. Otherwise state persists
    // across channel cycles — if you bounce away from CH2 and come back,
    // the bounce counter survives.
    const ch2State = { x: 0, y: 0, vx: 0, vy: 0, bounces: 0, lastMs: 0, initialized: false };
    const ch3State = {
      ballX: 0, ballY: 0, ballVx: 0, ballVy: 0,
      leftY: 0, rightY: 0,
      scoreL: 0, scoreR: 0,
      lastMs: 0, initialized: false,
    };

    // OSD notification — when channel changes, set to performance.now().
    // The signal callback paints the OSD plate with alpha computed from
    // (timeMs - shownAt). -Infinity == "never shown" so the gate skips
    // entirely until the user first interacts.
    let channelOsdShownAtMs = -Infinity;

    // Honor prefers-reduced-motion: keep channel content static (no
    // bouncing, no Pong rallies). The OSD still appears since fade
    // transitions are short and informational.
    const reducedMotionMq = window.matchMedia('(prefers-reduced-motion: reduce)');

    function changeChannel(delta) {
      const next = ((currentChannel + delta) % CHANNEL_LABELS.length + CHANNEL_LABELS.length) % CHANNEL_LABELS.length;
      if (next === currentChannel) return;
      currentChannel = next;
      brand.dataset.channel = String(currentChannel + 1);
      const numEl = document.querySelector('.channel-bar__num');
      if (numEl) numEl.textContent = String(currentChannel + 1);
      const live = document.querySelector('.channel-live');
      if (live) live.textContent = `Channel ${currentChannel + 1}, ${CHANNEL_LABELS[currentChannel]}`;
      channelOsdShownAtMs = performance.now();
      // Force the per-channel scene to reset its motion state — so a
      // fresh ball direction and a center-of-screen bouncing logo
      // greet the user each time they arrive on the channel.
      ch2State.initialized = false;
      ch3State.initialized = false;
      // CTA hover/press state can get "stuck" if the user was hovering
      // it and then switched channels (mouseleave won't necessarily fire
      // when pointer-events drops to none). Snap targets and current to
      // rest so the button is at rest the next time the user returns.
      ctaHoverTarget = 0; ctaPressTarget = 0;
      ctaHover = 0;       ctaPress = 0;
    }

    // Button wiring. The chevron + label are <span>s for typography,
    // so the click target is the parent <button>. Pointer events on
    // the button were re-enabled in CSS (the parent .channel-bar is
    // pointer-events: none so it can't shadow the underlying canvas).
    const prevBtn = document.querySelector('.channel-btn--prev');
    const nextBtn = document.querySelector('.channel-btn--next');
    if (prevBtn) prevBtn.addEventListener('click', () => changeChannel(-1));
    if (nextBtn) nextBtn.addEventListener('click', () => changeChannel(+1));

    // Document-level keyboard shortcuts for channel cycling. Active
    // only in dark mode (no CRT, no channels). Modifier keys and form
    // inputs short-circuit so the page doesn't hijack normal page
    // interactions (Ctrl+Right to jump words in DevTools console, etc.).
    document.addEventListener('keydown', (e) => {
      if (!isDark()) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const t = e.target;
      if (t && (t.matches && t.matches('input, textarea, select') || t.isContentEditable)) return;
      if (e.key === 'ArrowLeft')      { e.preventDefault(); changeChannel(-1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); changeChannel(+1); }
    });

    // Read live geometry from the DOM. Returns null if any element has
    // zero width/height (e.g. display:none during light-mode).
    function readLayout() {
      const brandRect    = brand.getBoundingClientRect();
      const markRect     = mark.getBoundingClientRect();
      const wordmarkRect = wordmark.getBoundingClientRect();
      if (brandRect.width === 0 || brandRect.height === 0) return null;

      const wmStyle = window.getComputedStyle(wordmark);
      const fontPx = parseFloat(wmStyle.fontSize);
      const lineHeight = parseFloat(wmStyle.lineHeight);
      // CSS line-height < 1 puts the em-box top above the line-box top
      // (the line box is shorter than the em). textBaseline 'top' in
      // canvas anchors to the em-box top; bounding rect anchors to the
      // line-box top. Offset by half the difference so the canvas text
      // sits where the live text sits.
      const emToLineBoxOffset = (fontPx - lineHeight) / 2;

      // Page-relative position of the canvas top-left (in page coords,
      // i.e. document scroll-position-independent — getBoundingClientRect
      // already accounts for scroll). Used to phase-align the dot pattern
      // with the .page::before halftone wash so dots line up continuously
      // across the screen edge. .page is at (0, 0) relative to itself, so
      // brandRect.left is the brand's offset from the page's top-left
      // (the page is the document root layout container).
      const page = document.querySelector('.page');
      const pageRect = page ? page.getBoundingClientRect() : { left: 0, top: 0 };

      // Width/height include the halo margin: the canvas is HALO_MARGIN
      // bigger than .brand on each side. All content x/y inside the
      // source canvas is offset by HALO_MARGIN.
      const M = HERO_HALO_MARGIN_PX;

      // Canvas top-left in viewport coords. Used to map sprinkles'
      // viewport-relative bounding rects into canvas-source coords.
      const canvasVpLeft = brandRect.left - M;
      const canvasVpTop  = brandRect.top  - M;
      const canvasVpRight  = brandRect.right  + M;
      const canvasVpBottom = brandRect.bottom + M;

      // Detect SVG sprinkles whose live bounding rect intersects the
      // canvas region. For each, capture the canvas-coord center, the
      // unrotated CSS dimensions, and the CSS rotation. The signal
      // callback re-draws these on the canvas so the screen edge looks
      // like the sprinkle wraps from paper into phosphor.
      const sprinkles = [];
      for (const spr of svgSprinkles) {
        if (!sprinkleImages.has(spr)) continue;
        const r = spr.getBoundingClientRect();
        if (r.width === 0 || r.height === 0) continue;
        if (r.right  <= canvasVpLeft ||
            r.left   >= canvasVpRight ||
            r.bottom <= canvasVpTop  ||
            r.top    >= canvasVpBottom) continue;

        const sprStyle = window.getComputedStyle(spr);
        let cssW = parseFloat(sprStyle.width);
        let cssH = parseFloat(sprStyle.height);
        if (isNaN(cssW) || cssW === 0) {
          // Fallback: use the rotated AABB dimensions (loses crispness
          // but at least the sprinkle still appears).
          cssW = r.width;
          cssH = r.height;
        } else if (isNaN(cssH) || cssH === 0) {
          // Height is `auto`; derive from the SVG's viewBox aspect.
          const vb = spr.getAttribute('viewBox');
          if (vb) {
            const parts = vb.split(/\s+/).map(parseFloat);
            cssH = parts.length === 4 ? cssW * (parts[3] / parts[2]) : cssW;
          } else {
            cssH = cssW;
          }
        }

        sprinkles.push({
          element: spr,
          centerX: r.left + r.width  / 2 - canvasVpLeft,
          centerY: r.top  + r.height / 2 - canvasVpTop,
          width:  cssW,
          height: cssH,
          rotation: getRotationRad(spr),
        });
      }

      // Wordmark parts — each glyph piece (interslice, ·, systems) is
      // anchored to its own DOM bounding rect, so canvas measureText
      // semantics and CSS layout never disagree about widths or middot
      // positioning. Per-part computed font-weight is captured because
      // the middle <b> overrides the wordmark's default 700 with 500.
      const wordmarkParts = Array.from(wordmark.querySelectorAll('[data-wordmark-part]')).map((el) => {
        const r = el.getBoundingClientRect();
        const st = window.getComputedStyle(el);
        return {
          text: el.textContent,
          x: Math.round(r.left - brandRect.left + M),
          weight: st.fontWeight || '400',
        };
      });

      // CTA layout — captured per-resize like the wordmark. Reads
      // bounding rects at rest (hover/press transforms aren't applied
      // here under normal use because the resize observer fires on
      // size changes, not hover). The signal callback adds the
      // JS-lerped hover/press translate on top of these resting
      // positions per frame.
      const ctaButtonLayout = ctaEl    ? captureCRTTextLayout(ctaEl,    brandRect, M) : null;
      const ctaTextLayout   = ctaText  ? captureCRTTextLayout(ctaText,  brandRect, M) : null;
      const ctaArrowLayout  = ctaArrow ? captureCRTTextLayout(ctaArrow, brandRect, M) : null;
      const ctaLabelLayout  = ctaLabel ? captureCRTTextLayout(ctaLabel, brandRect, M, { textTransform: 'uppercase' }) : null;
      const ctaSubLayout    = ctaSub   ? captureCRTTextLayout(ctaSub,   brandRect, M, { textTransform: 'uppercase' }) : null;

      // Laser grid endpoints in canvas-source coords. setupLaserGrid()
      // pins .laser-grid's `top` to brandCenterY in page coords, and
      // the SVG viewBox maps y=0 → that container top. So viewBox
      // y=0 lives at page y = brandCenterY (the horizon), and
      // viewBox y=GRID_VH at page y = pageRect.height (page bottom).
      // x maps linearly from viewBox 0..GRID_VW to page 0..pageWidth.
      // Subtracting (canvasPageX, canvasPageY) converts page coords
      // to canvas-source coords — same transform the dot-pattern
      // phase uses.
      const canvasPageX = brandRect.left - pageRect.left - M;
      const canvasPageY = brandRect.top  - pageRect.top  - M;
      const brandCenterY      = brandRect.top + brandRect.height / 2 - pageRect.top;
      const gridContainerH    = pageRect.height - brandCenterY;
      const gridXScale        = pageRect.width  / GRID_VW;
      const gridYScale        = gridContainerH  / GRID_VH;
      const gridCanvasOffsetX = -canvasPageX;
      const gridCanvasOffsetY = brandCenterY - canvasPageY;
      const gridLines = GRID_LINES.map((l) => ({
        x1: l.x1 * gridXScale + gridCanvasOffsetX,
        y1: l.y1 * gridYScale + gridCanvasOffsetY,
        x2: l.x2 * gridXScale + gridCanvasOffsetX,
        y2: l.y2 * gridYScale + gridCanvasOffsetY,
        kind: l.kind,
        opacity: l.opacity,
      }));

      return {
        width:  Math.round(brandRect.width  + 2 * M),
        height: Math.round(brandRect.height + 2 * M),
        logoX:    Math.round(markRect.left - brandRect.left + M),
        logoY:    Math.round(markRect.top  - brandRect.top  + M),
        logoSize: Math.round(markRect.width),
        wordmarkX:    Math.round(wordmarkRect.left - brandRect.left + M),
        wordmarkTopY: Math.round(wordmarkRect.top  - brandRect.top  + M - emToLineBoxOffset),
        wordmarkW:    Math.round(wordmarkRect.width),
        wordmarkH:    Math.round(wordmarkRect.height),
        fontPx,
        // Canvas top-left in page coords — used for dot-pattern phase.
        canvasPageX,
        canvasPageY,
        sprinkles,
        gridLines,
        wordmarkParts,
        ctaButton: ctaButtonLayout,
        ctaLabel:  ctaLabelLayout,
        ctaSub:    ctaSubLayout,
        ctaText:   ctaTextLayout,
        ctaArrow:  ctaArrowLayout,
      };
    }

    // ===== CHANNEL PAINTERS =====
    // Each channel is a function that paints onto the signal canvas
    // assuming the substrate + halftone wash have already been laid down
    // by signal(). Painters branch on currentChannel inside signal(),
    // so adding a new channel = add a label + a painter + a branch.

    // CH1: the regular programming — laser grid, sprinkles, logo,
    // wordmark, CTA. This is the original signal() body, factored
    // unchanged into a function. The CTA still rides the live <a>
    // for click targeting; the paint just mirrors its hover/press.
    function paintChannel1(ctx, timeMs) {
      // 1bb. Laser grid — re-paint the page's perspective floor inside
      //      the screen so lines pixelate through the phosphor pipeline
      //      when they cross the canvas edge (same dual-paint trick as
      //      the sprinkles). Source colors are noticeably brighter than
      //      the page-level CSS rgb(0 168 243) to compensate for the
      //      pipeline's cell-sampling + stripe-decomposition + gap-mask
      //      attenuation; both should land at roughly the same on-screen
      //      brightness so the lines read continuous across the edge.
      //      Horizon is drawn after the regular lines so it sits on top
      //      of the near-horizon vertical cluster.
      if (layout.gridLines) {
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = GRID_CRT_COLOR;
        for (const ln of layout.gridLines) {
          if (ln.kind === 'horizon') continue;
          if (ln.opacity < 1) ctx.globalAlpha = ln.opacity;
          ctx.beginPath();
          ctx.moveTo(ln.x1, ln.y1);
          ctx.lineTo(ln.x2, ln.y2);
          ctx.stroke();
          if (ln.opacity < 1) ctx.globalAlpha = 1;
        }
        ctx.lineWidth = 3;
        ctx.strokeStyle = GRID_CRT_HORIZON_COLOR;
        for (const ln of layout.gridLines) {
          if (ln.kind !== 'horizon') continue;
          ctx.beginPath();
          ctx.moveTo(ln.x1, ln.y1);
          ctx.lineTo(ln.x2, ln.y2);
          ctx.stroke();
        }
      }

      // 1c. Sprinkles whose live position intersects the canvas region:
      //     paint the rasterized SVG at the canvas-relative center, with
      //     the same rotation the live element has. The live sprinkle
      //     stays in the DOM at its original page position; outside the
      //     canvas the page paint shows, inside the canvas the substrate
      //     covers the live element and this paint shows in its place —
      //     so the shape reads as continuous across the screen edge.
      for (const spr of layout.sprinkles) {
        const img = sprinkleImages.get(spr.element);
        if (!img) continue;
        ctx.save();
        ctx.translate(spr.centerX, spr.centerY);
        if (spr.rotation) ctx.rotate(spr.rotation);
        ctx.drawImage(img, -spr.width / 2, -spr.height / 2, spr.width, spr.height);
        ctx.restore();
      }

      // 2. Logo — composited in the transparent offscreen canvas
      //    (arms + rotating hub + aqua gloss via source-atop), then
      //    blitted onto the main source canvas at the live logo position.
      logoCtx.clearRect(0, 0, layout.logoSize, layout.logoSize);

      logoCtx.drawImage(armsImg, 0, 0, layout.logoSize, layout.logoSize);

      logoCtx.save();
      const hubC = layout.logoSize / 2;
      logoCtx.translate(hubC, hubC);
      logoCtx.rotate(hubAngleDeg(timeMs) * Math.PI / 180);
      logoCtx.translate(-hubC, -hubC);
      logoCtx.drawImage(hubImg, 0, 0, layout.logoSize, layout.logoSize);
      logoCtx.restore();

      logoCtx.save();
      logoCtx.globalCompositeOperation = 'source-atop';
      logoCtx.drawImage(aquaImg, 0, 0, layout.logoSize, layout.logoSize);
      logoCtx.restore();

      ctx.drawImage(logoCanvas, layout.logoX, layout.logoY);

      // 3. Wordmark — paint each glyph part at its own DOM-anchored x.
      //    The spans were injected at init time so all three parts
      //    (interslice, ·, systems) have queryable bounding rects;
      //    between-parts spacing (including the middot's .wordmark i
      //    margins and letter-spacing: 0 override) comes from CSS for
      //    free. textBaseline 'top' aligns to the em-box top;
      //    wordmarkTopY already includes the em-vs-line-box offset.
      ctx.fillStyle = HERO_WORDMARK_COLOR;
      ctx.textBaseline = 'top';
      const fontPx = layout.fontPx;
      if ('letterSpacing' in ctx) {
        ctx.letterSpacing = (fontPx * HERO_WORDMARK_LETTER_SPACING_EM) + 'px';
      }
      for (const part of layout.wordmarkParts) {
        ctx.font = `${part.weight} ${fontPx}px ${HERO_WORDMARK_FONT}`;
        ctx.fillText(part.text, part.x, layout.wordmarkTopY);
      }

      // 4. CTA — paint the "Visit our new web-site!" label, the
      //    Mirepoix button (with its magenta+paper stamp shadow), the
      //    "mirepoix.recipes" text, the "↗" arrow, and the Firefox
      //    sub-link. The live <a> stays in the DOM underneath, invisible
      //    in dark mode but still clickable (canvas has pointer-events:
      //    none). Hover/press transitions ride the live element via CSS
      //    transition; the canvas paint follows via JS-lerped offsets.

      // Per-frame ease toward the interaction targets. 0.22 ≈ 165 ms
      // settle at 60fps; close enough to the CSS 140 ms ease-snap that
      // the press-down feel survives, without trying to bounce.
      const kEase = 0.22;
      ctaHover += (ctaHoverTarget - ctaHover) * kEase;
      ctaPress += (ctaPressTarget - ctaPress) * kEase;

      // .cta-label — flanking 28×2 rules + centered uppercase caption.
      if (layout.ctaLabel) {
        const L = layout.ctaLabel;
        ctx.fillStyle = HERO_CTA_LABEL_COLOR;
        ctx.fillRect(L.x, L.y + L.h / 2 - 1, 28, 2);
        ctx.fillRect(L.x + L.w - 28, L.y + L.h / 2 - 1, 28, 2);
        paintCRTText(ctx, L, {
          fontFamily: HERO_CTA_MONO_FONT,
          color: HERO_CTA_LABEL_COLOR,
          align: 'center',
          baseline: 'middle',
        });
      }

      // .cta — bordered button with magenta+paper stamp shadow.
      if (layout.ctaButton) {
        const B = layout.ctaButton;

        // Mirror .cta:hover / .cta:active translations. CSS:
        //   :hover  → translate(-2px, -2px)
        //   :active → translate( 5px,  5px)   (overrides hover)
        // Compose: baseline tx pulled by hover, then crossfade to +5
        // by press. ty == tx (CSS uses the same value on both axes).
        const baseTx  = HERO_CTA_HOVER_TX_PX * ctaHover;
        const tx      = baseTx + (HERO_CTA_PRESS_TX_PX - baseTx) * ctaPress;
        const ty      = tx;
        // Stamp geometry: 8→10 px offset with hover, collapses to 0 with press.
        const baseOff = HERO_CTA_STAMP_REST_PX
                      + (HERO_CTA_STAMP_HOVER_PX - HERO_CTA_STAMP_REST_PX) * ctaHover;
        const stampOff = baseOff * (1 - ctaPress);
        const ringPx   = HERO_CTA_STAMP_RING_PX * (1 - ctaPress);

        // Ring (paper-bright phosphor, sits behind magenta).
        if (ringPx > 0.5 && stampOff > 0.5) {
          ctx.fillStyle = HERO_CTA_RING;
          ctx.fillRect(
            B.x + stampOff - ringPx,
            B.y + stampOff - ringPx,
            B.w + ringPx * 2,
            B.h + ringPx * 2
          );
        }
        // Magenta stamp on top of the ring.
        if (stampOff > 0.5) {
          ctx.fillStyle = HERO_CTA_MAGENTA;
          ctx.fillRect(B.x + stampOff, B.y + stampOff, B.w, B.h);
        }

        // Button face: re-paint the substrate so the stamp shadow is
        // cleanly cut at the button edge instead of bleeding through.
        // (The halftone wash would technically need to re-tile here for
        // perfect continuity; the wash through the button is faint
        // enough that the missing dots aren't noticeable.)
        ctx.fillStyle = HERO_SUBSTRATE;
        ctx.fillRect(B.x + tx, B.y + ty, B.w, B.h);

        // Border (3px white phosphor). Inset by half-width so the stroke
        // lands exactly on the button's CSS border-box edge.
        ctx.lineWidth = HERO_CTA_BORDER_PX;
        ctx.strokeStyle = HERO_CTA_BORDER;
        const bp = HERO_CTA_BORDER_PX / 2;
        ctx.strokeRect(B.x + tx + bp, B.y + ty + bp, B.w - HERO_CTA_BORDER_PX, B.h - HERO_CTA_BORDER_PX);

        // "mirepoix.recipes" — center-anchored in the <b>'s bbox.
        // baseline:'middle' matches the .cta-label and .cta-sub
        // convention and is robust to the canvas/CSS ascent metric
        // disagreement that pulls textBaseline 'top' visibly upward
        // even when the parent's line-height is 1.
        if (layout.ctaText) {
          paintCRTText(ctx, layout.ctaText, {
            fontFamily: HERO_WORDMARK_FONT,
            color: HERO_CTA_TEXT_COLOR,
            align: 'center',
            baseline: 'middle',
            tx, ty,
          });
        }

        // "↗" arrow — already includes its CSS translateY(-2px) in the
        // captured rect (getBoundingClientRect reflects transforms).
        // letterSpacingPx 0 because the arrow is one glyph and shouldn't
        // inherit the button's font-wide tracking.
        if (layout.ctaArrow) {
          paintCRTText(ctx, layout.ctaArrow, {
            fontFamily: HERO_WORDMARK_FONT,
            color: HERO_CTA_ARROW_COLOR,
            tx, ty,
            letterSpacingPx: 0,
          });
        }
      }

      // .cta-sub — "Mozilla Firefox recommended" single-line caption.
      if (layout.ctaSub) {
        paintCRTText(ctx, layout.ctaSub, {
          fontFamily: HERO_CTA_MONO_FONT,
          color: HERO_CTA_LABEL_COLOR,
          align: 'center',
          baseline: 'middle',
        });
      }
    }

    // CH2 — DEMO REEL. The IS mark bouncing around the screen at
    // ~70 px/s, "will it hit the corner?" energy. The hub still spins
    // (driven by hubAngleDeg(timeMs), shared with CH1) so the
    // brand-mark life signs survive. Bounce count compounds in a small
    // counter at the bottom of the screen — a low-key "uptime ticker"
    // for the channel. Reduced-motion: hold still in the center.
    function paintChannel2(ctx, timeMs) {
      const W = layout.width, H = layout.height;
      // Stage padding leaves room for the OSD plate top-right and the
      // bounce counter bottom-center without overlap.
      const STAGE_PAD_X = 28;
      const STAGE_PAD_TOP = 40;
      const STAGE_PAD_BOT = 32;
      const stageX0 = STAGE_PAD_X;
      const stageY0 = STAGE_PAD_TOP;
      const stageX1 = W - STAGE_PAD_X;
      const stageY1 = H - STAGE_PAD_BOT;

      // Logo size proportional to the screen — wide screens get a
      // proportionally larger logo so the bounce reads from a glance.
      const logoSize = Math.max(48, Math.round(Math.min(stageX1 - stageX0, stageY1 - stageY0) * 0.34));

      if (!ch2State.initialized) {
        ch2State.x = (stageX0 + stageX1 - logoSize) / 2;
        ch2State.y = (stageY0 + stageY1 - logoSize) / 2;
        // Pick an off-axis launch direction so the path doesn't
        // immediately fall into a boring straight cycle. Seed from
        // performance.now() so repeat visits feel different.
        const ang = (performance.now() * 0.0017) % (Math.PI * 2);
        const speed = 72;
        // Bias away from cardinal directions for a more interesting path.
        ch2State.vx = Math.cos(ang + 0.6) * speed;
        ch2State.vy = Math.sin(ang + 0.6) * speed * 0.78;
        if (Math.abs(ch2State.vx) < 20) ch2State.vx = ch2State.vx >= 0 ? 30 : -30;
        if (Math.abs(ch2State.vy) < 20) ch2State.vy = ch2State.vy >= 0 ? 25 : -25;
        ch2State.lastMs = timeMs;
        ch2State.initialized = true;
      }

      if (!reducedMotionMq.matches) {
        // Cap dt so a tab being backgrounded then refocused doesn't
        // teleport the logo through three walls in one frame.
        const dt = Math.min(0.05, Math.max(0, (timeMs - ch2State.lastMs) / 1000));
        ch2State.lastMs = timeMs;
        ch2State.x += ch2State.vx * dt;
        ch2State.y += ch2State.vy * dt;
        if (ch2State.x <= stageX0) {
          ch2State.x = stageX0;
          ch2State.vx = Math.abs(ch2State.vx);
          ch2State.bounces++;
        }
        if (ch2State.x + logoSize >= stageX1) {
          ch2State.x = stageX1 - logoSize;
          ch2State.vx = -Math.abs(ch2State.vx);
          ch2State.bounces++;
        }
        if (ch2State.y <= stageY0) {
          ch2State.y = stageY0;
          ch2State.vy = Math.abs(ch2State.vy);
          ch2State.bounces++;
        }
        if (ch2State.y + logoSize >= stageY1) {
          ch2State.y = stageY1 - logoSize;
          ch2State.vy = -Math.abs(ch2State.vy);
          ch2State.bounces++;
        }
      }

      // Composite into logoCanvas the same way CH1 does so the rotating
      // hub gets the same arms+hub+aqua-gloss treatment. logoCanvas was
      // sized to layout.logoSize in createTrinitron(); we draw at logoSize
      // (CH2-local) by passing destination dimensions to drawImage so the
      // offscreen canvas doesn't need a resize per frame.
      logoCtx.clearRect(0, 0, layout.logoSize, layout.logoSize);
      logoCtx.drawImage(armsImg, 0, 0, layout.logoSize, layout.logoSize);
      logoCtx.save();
      const hubC = layout.logoSize / 2;
      logoCtx.translate(hubC, hubC);
      logoCtx.rotate(hubAngleDeg(timeMs) * Math.PI / 180);
      logoCtx.translate(-hubC, -hubC);
      logoCtx.drawImage(hubImg, 0, 0, layout.logoSize, layout.logoSize);
      logoCtx.restore();
      logoCtx.save();
      logoCtx.globalCompositeOperation = 'source-atop';
      logoCtx.drawImage(aquaImg, 0, 0, layout.logoSize, layout.logoSize);
      logoCtx.restore();
      ctx.drawImage(logoCanvas, ch2State.x, ch2State.y, logoSize, logoSize);

      // Bounce counter — phosphor-mono ticker at bottom-center. Pads to
      // 4 digits so the layout is stable up to 9999 bounces. The mono
      // font is already preloaded for the CTA captions.
      ctx.fillStyle = '#9BC8E0';
      ctx.font = '700 11px ' + HERO_CTA_MONO_FONT;
      if ('letterSpacing' in ctx) ctx.letterSpacing = '2.5px';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('BOUNCES ' + String(ch2State.bounces).padStart(4, '0'), W / 2, H - 16);
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      ctx.textAlign = 'start';
    }

    // CH3 — PONG. Autoplay match between two equally-skilled CPU
    // paddles. Paddles chase the ball y with a fixed pursuit speed
    // (so a fast vertical ball can outrun them — meaning the score
    // actually advances). Ball speed scales modestly on each paddle
    // hit; we cap it so the rally doesn't escalate into a blur.
    // Reduced-motion: static frozen frame.
    function paintChannel3(ctx, timeMs) {
      const W = layout.width, H = layout.height;
      const COURT_PAD_X = 20;
      const COURT_PAD_TOP = 42;  // room for score
      const COURT_PAD_BOT = 18;
      const courtX0 = COURT_PAD_X;
      const courtY0 = COURT_PAD_TOP;
      const courtX1 = W - COURT_PAD_X;
      const courtY1 = H - COURT_PAD_BOT;

      const paddleW = 4, paddleH = 28;
      const ballSize = 5;
      const paddleInset = 10;

      if (!ch3State.initialized) {
        ch3State.ballX = (courtX0 + courtX1) / 2 - ballSize / 2;
        ch3State.ballY = (courtY0 + courtY1) / 2 - ballSize / 2;
        // Random initial side + vertical drift so a freshly-entered
        // channel doesn't show the same opening every time.
        const dir = Math.random() < 0.5 ? -1 : 1;
        ch3State.ballVx = 115 * dir;
        ch3State.ballVy = (Math.random() - 0.5) * 130;
        ch3State.leftY  = (courtY0 + courtY1) / 2 - paddleH / 2;
        ch3State.rightY = (courtY0 + courtY1) / 2 - paddleH / 2;
        ch3State.scoreL = 0;
        ch3State.scoreR = 0;
        ch3State.lastMs = timeMs;
        ch3State.initialized = true;
      }

      if (!reducedMotionMq.matches) {
        const dt = Math.min(0.05, Math.max(0, (timeMs - ch3State.lastMs) / 1000));
        ch3State.lastMs = timeMs;

        ch3State.ballX += ch3State.ballVx * dt;
        ch3State.ballY += ch3State.ballVy * dt;

        // Top/bottom wall bounce
        if (ch3State.ballY <= courtY0) {
          ch3State.ballY = courtY0;
          ch3State.ballVy = Math.abs(ch3State.ballVy);
        }
        if (ch3State.ballY + ballSize >= courtY1) {
          ch3State.ballY = courtY1 - ballSize;
          ch3State.ballVy = -Math.abs(ch3State.ballVy);
        }

        // Paddle AI — chase ball y with a fixed top speed. The fixed
        // speed (rather than instant follow) means a steeply-angled
        // ball can outrun a paddle, which is exactly what produces a
        // miss and a score. AI_SPEED also caps the visual "twitchiness"
        // of the paddles.
        const AI_SPEED = 110;
        const ballCenterY = ch3State.ballY + ballSize / 2;
        function chase(curY) {
          const center = curY + paddleH / 2;
          const diff = ballCenterY - center;
          const move = Math.sign(diff) * Math.min(Math.abs(diff), AI_SPEED * dt);
          let y = curY + move;
          if (y < courtY0) y = courtY0;
          if (y + paddleH > courtY1) y = courtY1 - paddleH;
          return y;
        }
        ch3State.leftY  = chase(ch3State.leftY);
        ch3State.rightY = chase(ch3State.rightY);

        // Paddle collision. Each hit reverses horizontal velocity and
        // adds a small "english" based on where on the paddle the ball
        // landed — top of paddle deflects upward, bottom deflects down.
        // Speeds up by 4% per hit so rallies build, capped at MAX_VX.
        const leftX  = courtX0 + paddleInset;
        const rightX = courtX1 - paddleInset - paddleW;
        const MAX_VX = 260, MAX_VY = 260;
        if (ch3State.ballVx < 0 &&
            ch3State.ballX <= leftX + paddleW &&
            ch3State.ballX + ballSize >= leftX &&
            ch3State.ballY + ballSize >= ch3State.leftY &&
            ch3State.ballY <= ch3State.leftY + paddleH) {
          ch3State.ballX = leftX + paddleW;
          ch3State.ballVx = Math.min(MAX_VX, Math.abs(ch3State.ballVx) * 1.04);
          const offset = (ballCenterY - (ch3State.leftY + paddleH / 2)) / (paddleH / 2);
          ch3State.ballVy += offset * 70;
        }
        if (ch3State.ballVx > 0 &&
            ch3State.ballX + ballSize >= rightX &&
            ch3State.ballX <= rightX + paddleW &&
            ch3State.ballY + ballSize >= ch3State.rightY &&
            ch3State.ballY <= ch3State.rightY + paddleH) {
          ch3State.ballX = rightX - ballSize;
          ch3State.ballVx = -Math.min(MAX_VX, Math.abs(ch3State.ballVx) * 1.04);
          const offset = (ballCenterY - (ch3State.rightY + paddleH / 2)) / (paddleH / 2);
          ch3State.ballVy += offset * 70;
        }
        if (Math.abs(ch3State.ballVy) > MAX_VY) {
          ch3State.ballVy = Math.sign(ch3State.ballVy) * MAX_VY;
        }

        // Score + serve. Loser of the point serves toward the winner
        // (classic Pong convention), so the volley restarts from
        // center and heads toward whoever just scored.
        if (ch3State.ballX + ballSize < courtX0) {
          ch3State.scoreR++;
          ch3State.ballX = (courtX0 + courtX1) / 2 - ballSize / 2;
          ch3State.ballY = (courtY0 + courtY1) / 2 - ballSize / 2;
          ch3State.ballVx = 115;
          ch3State.ballVy = (Math.random() - 0.5) * 130;
        } else if (ch3State.ballX > courtX1) {
          ch3State.scoreL++;
          ch3State.ballX = (courtX0 + courtX1) / 2 - ballSize / 2;
          ch3State.ballY = (courtY0 + courtY1) / 2 - ballSize / 2;
          ch3State.ballVx = -115;
          ch3State.ballVy = (Math.random() - 0.5) * 130;
        }
      }

      // Court center net — vertical dashed line, classic Pong.
      ctx.fillStyle = 'rgba(220, 245, 255, 0.55)';
      const dashH = 9, dashGap = 7, dashW = 2;
      const cx = Math.round((courtX0 + courtX1) / 2 - dashW / 2);
      for (let y = courtY0 + 4; y + dashH < courtY1; y += dashH + dashGap) {
        ctx.fillRect(cx, y, dashW, dashH);
      }

      // Paddles + ball — pure white so all three phosphor stripes light
      // at max. The pipeline will give them the soft aperture-grille
      // bloom + scanline texture that makes them feel like real CRT
      // phosphor instead of crisp rectangles.
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(courtX0 + paddleInset, ch3State.leftY, paddleW, paddleH);
      ctx.fillRect(courtX1 - paddleInset - paddleW, ch3State.rightY, paddleW, paddleH);
      ctx.fillRect(ch3State.ballX, ch3State.ballY, ballSize, ballSize);

      // Score — large VT323 numerals top-center, flanking the net.
      // VT323 is loaded by tokens.css's @import; if it hasn't arrived
      // by first frame the fallback monospace still reads as period-
      // appropriate. Always two digits so the layout doesn't jump
      // when crossing 10.
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '400 34px "VT323", "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      const scoreY = 6;
      ctx.fillText(String(ch3State.scoreL).padStart(2, '0'), W / 2 - 36, scoreY);
      ctx.fillText(String(ch3State.scoreR).padStart(2, '0'), W / 2 + 36, scoreY);
      ctx.textAlign = 'start';
    }

    // OSD plate — pops up top-right when the channel changes, fades
    // out after CH_OSD_DURATION_MS. Painted into the signal canvas so
    // it goes through the phosphor pipeline (period-correct fuzziness).
    // Sits inside the brand box (insets past HERO_HALO_MARGIN_PX) so
    // it doesn't overlap the bezel cutout shadow.
    //
    // Uses performance.now() rather than the signal callback's `timeMs`
    // because timeMs is renderer-relative (since the Trinitron started)
    // and resets to 0 when the renderer is recreated on resize/theme
    // toggle. channelOsdShownAtMs is set in changeChannel() against the
    // same wall clock so the elapsed math is stable across resizes.
    function paintChannelOSD(ctx, _timeMs) {
      const elapsed = performance.now() - channelOsdShownAtMs;
      if (elapsed < 0 || elapsed > CH_OSD_DURATION_MS) return;
      const fadeIn = Math.min(1, elapsed / CH_OSD_FADE_IN_MS);
      const fadeOut = Math.min(1, (CH_OSD_DURATION_MS - elapsed) / CH_OSD_FADE_OUT_MS);
      const alpha = Math.max(0, Math.min(fadeIn, fadeOut));
      if (alpha <= 0.001) return;

      const text = 'CH ' + (currentChannel + 1) + '   ' + CHANNEL_LABELS[currentChannel];

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = `${CH_OSD_FONT_WEIGHT} ${CH_OSD_FONT_PX}px ${HERO_WORDMARK_FONT}`;
      ctx.textBaseline = 'middle';
      if ('letterSpacing' in ctx) ctx.letterSpacing = '0.12em';
      const padX = 11, padY = 7;
      const textW = ctx.measureText(text).width;
      const plateW = Math.round(textW + padX * 2);
      const plateH = 24;
      // The .brand::after bezel cutout paints a heavy inset shadow
      // (36px blur + 8px spread) plus an extra top-edge band — about
      // 45px of darkness in from each canvas edge. The plate has to
      // clear that or the phosphor pipeline + bezel together render
      // it invisible. inset 48 puts the plate top ~32px past the
      // brand's top edge, well into the lit screen area.
      const inset = HERO_HALO_MARGIN_PX + 32;
      const plateX = layout.width - plateW - 16;
      const plateY = inset;

      // Plate body — translucent navy so the channel content reads
      // faintly through it (very 90s OSD).
      ctx.fillStyle = 'rgba(2, 14, 38, 0.78)';
      ctx.fillRect(plateX, plateY, plateW, plateH);
      // Top edge: bright cyan phosphor sliver. The bottom edge gets a
      // dimmer sliver — like a 1px bezel highlight at top + shadow at bottom.
      ctx.fillStyle = 'rgba(120, 230, 255, 0.95)';
      ctx.fillRect(plateX, plateY, plateW, 1);
      ctx.fillStyle = 'rgba(70, 160, 200, 0.35)';
      ctx.fillRect(plateX, plateY + plateH - 1, plateW, 1);

      // Text — pure white phosphor, sits roughly centered vertically.
      ctx.fillStyle = '#F0FAFF';
      ctx.fillText(text, plateX + padX, plateY + plateH / 2 + 0.5);

      if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
      ctx.restore();
    }

    // Signal callback closure — reads `layout` (outer scope) plus the
    // module-scope phosphor sources (armsImg/hubImg/aquaImg) and
    // logoCanvas. Recreated implicitly each frame; layout is mutated
    // by createTrinitron(), not by the callback.
    function signal(ctx, timeMs) {
      if (!layout) return;

      // 1. Substrate — opaque CRT face under everything. Matches --bg
      //    so the page reads continuously through the screen. Shared
      //    across all channels.
      ctx.fillStyle = HERO_SUBSTRATE;
      ctx.fillRect(0, 0, layout.width, layout.height);

      // 1b. Halftone wash — replicates .page::before inside the screen,
      //     phase-aligned to the page grid so dots are continuous across
      //     the screen edge. Kept on every channel so the CRT face never
      //     looks plain (it reads as the same paper-tinted glow the page
      //     bg has — the channel content sits *on top* of it).
      const period = HERO_DOT_PERIOD;
      const tc = HERO_DOT_TILE_CENTER;
      const startX = ((tc - layout.canvasPageX) % period + period) % period;
      const startY = ((tc - layout.canvasPageY) % period + period) % period;
      ctx.fillStyle = HERO_DOT_COLOR;
      for (let y = startY; y < layout.height; y += period) {
        for (let x = startX; x < layout.width; x += period) {
          ctx.beginPath();
          ctx.arc(x, y, HERO_DOT_RADIUS, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 2. Channel content. Painters assume substrate + dots are already
      //    laid down. Sprinkles + laser grid are CH1-only because they're
      //    part of the page composition, not the CRT.
      if      (currentChannel === 0) paintChannel1(ctx, timeMs);
      else if (currentChannel === 1) paintChannel2(ctx, timeMs);
      else if (currentChannel === 2) paintChannel3(ctx, timeMs);

      // 3. OSD plate — always last so it sits on top of channel content.
      paintChannelOSD(ctx, timeMs);
    }

    function createTrinitron(newLayout) {
      if (!newLayout) return;
      const wasRunning = trinitron && trinitron._wasStartedByUser;
      if (trinitron) {
        try { trinitron.destroy(); } catch (_) { /* defensive */ }
        trinitron = null;
      }
      layout = newLayout;

      // Resize the offscreen logo canvas to match the live mark size.
      logoCanvas.width  = layout.logoSize;
      logoCanvas.height = layout.logoSize;

      // Force per-channel scenes to re-init against the new screen
      // rect on the next frame they paint. Without this, a viewport
      // resize while on CH2 could leave the bouncing logo trapped
      // outside the new stage rect (jittering at the wall forever).
      ch2State.initialized = false;
      ch3State.initialized = false;

      try {
        trinitron = new window.Trinitron(canvas, {
          signal,
          // Source canvas dimensions match the .brand box + halo margin.
          // 1 source px = 1 display px, so source content maps 1:1 to
          // display coordinates. The renderer multiplies by DPR
          // internally for the canvas backing buffer.
          viewSize:   [layout.width, layout.height],
          // 2× source → stripe-canvas pixels gives the aperture-grille
          // texture room to breathe.
          canvasSize: [layout.width * 2, layout.height * 2],
          cellSize: 3,
          stripeUpscale: 2,
          opaqueBackground: true,
          phosphorCoupling: 0.35,
          persistence: 0.82,
          convergence: { r: [-0.25, -0.25], g: [0, 0], b: [0.25, 0.25] },
          beamSpreadPx: 0.7,
          beamSpreadVerticalPx: 1.4,
          rowShimmer: 0.02,
          damperStrength: 0.90,
          bleedRadius: 18,
          bloomStrength: 1.2,
          gapMaskAlpha: 0.15,
          gapMaskPeriod: 2,
          effects: { gapMask: true },
          debugOverlay: true,
        });
        window.__trinitronLogo = trinitron;
        if (wasRunning && isDark()) trinitron.start();
      } catch (err) {
        // Silent fallback — SVG dark-mode logo remains as the static fallback.
      }
    }

    function syncWithTheme() {
      if (!trinitron) return;
      if (isDark()) {
        trinitron.start();
        document.documentElement.classList.add('trinitron-active');
      } else {
        trinitron.stop();
        document.documentElement.classList.remove('trinitron-active');
      }
    }

    // Initial creation
    createTrinitron(readLayout());
    syncWithTheme();

    // Re-sync when OS preference changes
    const colorMq = window.matchMedia('(prefers-color-scheme: dark)');
    const colorHandler = () => syncWithTheme();
    if (colorMq.addEventListener) colorMq.addEventListener('change', colorHandler);
    else if (colorMq.addListener) colorMq.addListener(colorHandler);

    // Re-sync when data-theme changes
    const themeObserver = new MutationObserver(syncWithTheme);
    themeObserver.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['data-theme'],
    });

    // Re-create the renderer when the .brand layout changes (viewport
    // resize, font load, etc.). Debounced — recreating the Trinitron
    // means tearing down and rebuilding the WebGL pipeline, which is
    // ~20 ms; mid-drag we'd hammer it. 200 ms gives a smooth feel.
    let resizeTimer = null;
    const resizeObs = new ResizeObserver(() => {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const newLayout = readLayout();
        if (!newLayout) return;
        // Skip recreation if nothing meaningful changed (sub-pixel
        // float drift can fire ResizeObserver without real layout change).
        if (layout
            && newLayout.width  === layout.width
            && newLayout.height === layout.height
            && newLayout.logoSize === layout.logoSize
            && Math.abs(newLayout.fontPx - layout.fontPx) < 0.5) {
          return;
        }
        createTrinitron(newLayout);
        syncWithTheme();
      }, 200);
    });
    resizeObs.observe(brand);
  }

  function onReady() {
    // setupLaserGrid runs unconditionally — the page-level SVG and
    // its positioning don't depend on Trinitron loading. init() then
    // wires in the in-CRT phosphorization on top.
    setupLaserGrid();
    init();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', onReady);
  } else {
    onReady();
  }
})();
</script>
</body>
</html>

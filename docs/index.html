<script>
(function () {
  'use strict';

  function isDark() {
    const t = document.documentElement.dataset.theme;
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  // Serialize a fragment (the arms or hub group) into a standalone SVG document,
  // wrap it in a blob URL, and resolve to a loaded HTMLImageElement.
  function rasterizeFragment(fragmentMarkup) {
    const doc = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">${fragmentMarkup}</svg>`;
    const blob = new Blob([doc], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }

  // Rasterize a live SVG element to an HTMLImageElement, with the
  // dark-mode form baked in: `.paper-only` groups are stripped, computed
  // `color` and `font-family` are inlined on the root so `currentColor`
  // and `<text>` elements resolve correctly in the standalone SVG (no
  // page CSS reaches the blob document). The .sprinkle class is
  // dropped from the clone — that class carries page-positioning rules
  // we don't want; the canvas applies positioning + rotation itself.
  function rasterizeSvgElement(svgElement) {
    const clone = svgElement.cloneNode(true);
    clone.querySelectorAll('.paper-only').forEach(g => g.remove());
    const style = window.getComputedStyle(svgElement);
    const inlineStyle = `color: ${style.color}; font-family: ${style.fontFamily}`;
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    const existing = clone.getAttribute('style');
    clone.setAttribute('style', existing ? `${existing}; ${inlineStyle}` : inlineStyle);
    clone.removeAttribute('class');
    const doc = clone.outerHTML;
    const blob = new Blob([doc], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }

  // Extract the rotation angle (radians) from an element's computed
  // CSS transform. Used so the canvas paint matches the live sprinkle's
  // rotation. Returns 0 for `none` or unparseable matrices.
  function getRotationRad(element) {
    const t = window.getComputedStyle(element).transform;
    if (!t || t === 'none') return 0;
    const m = t.match(/matrix\(([-\d.,\s]+)\)/);
    if (!m) return 0;
    const parts = m[1].split(',').map(parseFloat);
    return Math.atan2(parts[1], parts[0]);
  }

  // Markup for the two phosphor source groups. Kept inline so the script
  // is self-contained. Colors are pure RGB (lobes #FF0000/#00FF00/#0000FF)
  // and pure additive secondaries (overlaps #FFFF00/#FF00FF/#00FFFF) —
  // intentionally distinct from tokens.css's CMYK --ink-* palette so the
  // Trinitron stripe decomposition reads as authentically additive.
  const ARMS_MARKUP = `
    <g fill="none" stroke-width="24" stroke-linecap="round">
      <line x1="100" y1="100" x2="100"    y2="28"  stroke="#FF0000"/>
      <line x1="100" y1="100" x2="37.65"  y2="136" stroke="#00FF00"/>
      <line x1="100" y1="100" x2="162.35" y2="136" stroke="#0000FF"/>
    </g>
    <circle cx="100"    cy="28"  r="24" fill="#FF0000"/>
    <circle cx="37.65"  cy="136" r="24" fill="#00FF00"/>
    <circle cx="162.35" cy="136" r="24" fill="#0000FF"/>`;

  const HUB_MARKUP = `
    <path d="M 100 100 Q 114.736 88.487 134 100 A 34 34 0 0 0 117 70.555 Q 97.397 81.482 100 100 Z" fill="#FF00FF"/>
    <path d="M 100 100 Q 97.397 81.482 117 70.555 A 34 34 0 0 0 83 70.555 Q 82.662 92.995 100 100 Z" fill="#FF0000"/>
    <path d="M 100 100 Q 82.662 92.995 83 70.555 A 34 34 0 0 0 66 100 Q 85.264 111.513 100 100 Z" fill="#FFFF00"/>
    <path d="M 100 100 Q 85.264 111.513 66 100 A 34 34 0 0 0 83 129.445 Q 102.603 118.518 100 100 Z" fill="#00FF00"/>
    <path d="M 100 100 Q 102.603 118.518 83 129.445 A 34 34 0 0 0 117 129.445 Q 117.338 107.005 100 100 Z" fill="#00FFFF"/>
    <path d="M 100 100 Q 117.338 107.005 117 129.445 A 34 34 0 0 0 134 100 Q 114.736 88.487 100 100 Z" fill="#0000FF"/>`;

  // Aqua-style gloss for the displayed image — three layered effects per
  // lobe (three pinwheel-tip balls + central hub disc), composited into
  // the signal so they go through cell sampling, stripe render,
  // persistence, halo, and scan-band along with the colored phosphor:
  //   1. Inner glow — soft hazy rim, lobe reads as translucent gel.
  //   2. Top specular shine — dome highlight, the crisp overhead reflection.
  //   3. Bottom wet-bead reflection — thin highlight, "freshly licked."
  // Source-atop in the signal callback clips them to the bubble
  // silhouette so the straight arms between balls stay as glass tubes.
  const AQUA_MARKUP = `
    <defs>
      <linearGradient id="aTop" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.95"/>
        <stop offset="55%"  stop-color="#FFFFFF" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="aBot" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset="70%"  stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      </linearGradient>
      <radialGradient id="aGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset="60%"  stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset="88%"  stop-color="#FFFFFF" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      </radialGradient>
    </defs>

    <!-- Inner glow per lobe (drawn first, behind specular shines) -->
    <circle cx="100"    cy="28"  r="24" fill="url(#aGlow)"/>
    <circle cx="37.65"  cy="136" r="24" fill="url(#aGlow)"/>
    <circle cx="162.35" cy="136" r="24" fill="url(#aGlow)"/>
    <circle cx="100"    cy="100" r="34" fill="url(#aGlow)"/>

    <!-- Top specular shine: dome highlight in upper portion of each lobe -->
    <ellipse cx="100"    cy="21"  rx="17" ry="11" fill="url(#aTop)"/>
    <ellipse cx="37.65"  cy="129" rx="17" ry="11" fill="url(#aTop)"/>
    <ellipse cx="162.35" cy="129" rx="17" ry="11" fill="url(#aTop)"/>
    <ellipse cx="100"    cy="89"  rx="24" ry="15" fill="url(#aTop)"/>

    <!-- Bottom wet-bead reflection: thin highlight at lobe bottom -->
    <ellipse cx="100"    cy="46"  rx="13" ry="4" fill="url(#aBot)"/>
    <ellipse cx="37.65"  cy="154" rx="13" ry="4" fill="url(#aBot)"/>
    <ellipse cx="162.35" cy="154" rx="13" ry="4" fill="url(#aBot)"/>
    <ellipse cx="100"    cy="125" rx="18" ry="5" fill="url(#aBot)"/>`;

  // Rotation: 36 seconds for 360°, reverse direction — matches the SVG's
  // @keyframes hub-spin + .hub-segs animation, which drive the no-JS
  // fallback. Keep in sync if you ever retune the period.
  const ROT_PERIOD_MS = 36 * 1000;
  function hubAngleDeg(timeMs) {
    return -(timeMs / ROT_PERIOD_MS) * 360;
  }

  // Hero screen visual constants. Geometry (canvas size, logo size,
  // wordmark size/position) is now read from the live DOM per resize
  // by readLayout() inside init() — these constants are the ones that
  // don't depend on the live layout.

  // CRT substrate — the page's own --bg (--navy-0). The v2 engine
  // conserves energy through the grille (each region keeps its average
  // light), so the screen reads continuous with the page without the 3×
  // pre-brightening v1's light-eating stripes needed.
  const HERO_SUBSTRATE = '#000926';

  // Halftone dot wash — replicates .page::before's
  // `radial-gradient(--stamp-ink 1.1px, transparent 1.3px)` at
  // background-size 22px. A touch stronger than the page's flat dots so
  // they survive the beam's softening; phase-aligned to the page's dot
  // grid at paint time so the pattern is continuous across the screen
  // edge.
  const HERO_DOT_COLOR = 'rgba(244, 241, 234, 0.12)';
  const HERO_DOT_PERIOD = 22;
  const HERO_DOT_RADIUS = 1.3;
  // Page-bg dot is centered in its 22×22 tile (at 11, 11). The
  // canvas paints the same grid, offset so a dot just inside the
  // screen edge follows a dot just outside on the same lattice.
  const HERO_DOT_TILE_CENTER = HERO_DOT_PERIOD / 2;

  // Wordmark phosphor color — pure #FFFFFF so all three phosphor stripes
  // light at max under the wordmark, matching the pure-RGB lobe scheme.
  const HERO_WORDMARK_COLOR = '#FFFFFF';

  // Wordmark font stack — matches the live .wordmark's
  // var(--font-display) (Space Grotesk).
  const HERO_WORDMARK_FONT = '"Space Grotesk", "Hanken Grotesk", system-ui, sans-serif';

  // Wordmark letter-spacing in em units — matches the live .wordmark's
  // letter-spacing: -0.06em. Applied to canvas paints so glyph-internal
  // tracking matches CSS; between-parts spacing comes from each part's
  // own DOM rect, which already encodes the .wordmark i overrides.
  const HERO_WORDMARK_LETTER_SPACING_EM = -0.06;

  // Halo bleed margin around the live brand box, in display px. The
  // canvas extends this many CSS pixels beyond .brand on each side so
  // the phosphor halo isn't truncated at the brand's edge.
  const HERO_HALO_MARGIN_PX = 16;

  // ===== LASER GRID =====
  // Synthwave perspective floor. Geometry is authored in a 1200×600
  // viewBox space (horizon at y=0, near plane at y=600). The
  // vanishing point sits well above the visible frame so the lines
  // tilt aggressively over the visible height without converging
  // to a single point at the horizon — the visible horizon catches
  // the fan mid-way through its convergence.
  //
  // Two consumers share GRID_LINES:
  //   1. buildGridSvg() — builds the page-level SVG once at init.
  //   2. readLayout() / signal() — per-resize and per-frame, the
  //      same geometry is transformed into canvas-source coords
  //      and drawn into the Trinitron signal so the lines pixelate
  //      through the phosphor pipeline inside the CRT region.

  const GRID_VW    = 1200;
  const GRID_VH    = 600;
  const GRID_VP_X  = GRID_VW / 2;
  const GRID_VP_Y  = -150;
  // K is the fraction of the way from near-plane to VP that y=0
  // (the visible horizon) sits. K=0.8 means lines are caught only
  // 20% through their fan — steep tilt without single-VP convergence.
  const GRID_K     = GRID_VH / (GRID_VH - GRID_VP_Y);

  const GRID_LINES = (function () {
    const out = [];
    // 40 vertical lines, xBottom spread wide enough that
    // steeply-angled rays enter from the sides near the horizon
    // and fill the page corners.
    const VERT_COUNT = 40;
    for (let i = 0; i <= VERT_COUNT; i++) {
      const t = i / VERT_COUNT;
      const xBottom = -2400 + t * 6000;
      const xTop = xBottom * (1 - GRID_K) + GRID_VP_X * GRID_K;
      out.push({ x1: xBottom, y1: GRID_VH, x2: xTop, y2: 0, kind: 'v', opacity: 1 });
    }
    // Horizontal depth lines — y = GRID_VH * (1 − 1/(1+d)). Depths
    // tuned so foreground row spacing ≈ foreground column spacing
    // (~140 px), then compressing geometrically toward the horizon.
    const DEPTHS = [0.020, 0.043, 0.081, 0.154, 0.275, 0.5, 1.0, 2.33, 14];
    for (const d of DEPTHS) {
      const y = GRID_VH * (1 - 1 / (1 + d));
      out.push({
        x1: -400, y1: y, x2: GRID_VW + 400, y2: y, kind: 'h',
        opacity: Math.min(1, d * 2.5),  // fade near-horizon
      });
    }
    // Horizon line — kind 'horizon' so the in-CRT painter can
    // draw it last (on top of the near-horizon vertical cluster)
    // with a thicker, brighter stroke.
    out.push({ x1: -400, y1: 0, x2: GRID_VW + 400, y2: 0, kind: 'horizon', opacity: 1 });
    return out;
  })();

  // In-CRT paint colors. The Trinitron pipeline attenuates source
  // colors heavily (cell sampling × stripe decomposition × gap mask),
  // so the source feed needs to be a noticeable notch brighter than
  // the CSS rgb(0 168 243) used on the page-level SVG to land at the
  // same on-screen brightness through the pipeline.
  const GRID_CRT_COLOR         = '#00C8FF';
  const GRID_CRT_HORIZON_COLOR = '#DCF5FF';

  // Build the page-level SVG once: walks GRID_LINES and appends <line>
  // elements into the .grid-horizontals / .grid-verticals groups. The
  // horizon <line> is already in the source HTML (it's the single
  // visually-distinct element that warranted authored markup); the
  // computed lines all share the .grid-stroke class.
  function buildGridSvg(laserGridEl) {
    const svg = laserGridEl.querySelector('svg');
    if (!svg) return;
    const horizG = svg.querySelector('.grid-horizontals');
    const vertG  = svg.querySelector('.grid-verticals');
    if (!horizG || !vertG) return;
    const SVG_NS = 'http://www.w3.org/2000/svg';
    for (const line of GRID_LINES) {
      if (line.kind === 'horizon') continue;
      const ln = document.createElementNS(SVG_NS, 'line');
      ln.setAttribute('x1', line.x1);
      ln.setAttribute('y1', line.y1);
      ln.setAttribute('x2', line.x2);
      ln.setAttribute('y2', line.y2);
      ln.setAttribute('class', 'grid-stroke');
      if (line.opacity < 1) ln.setAttribute('stroke-opacity', line.opacity);
      if (line.kind === 'h') horizG.appendChild(ln);
      else vertG.appendChild(ln);
    }
  }

  // Runs at DOMContentLoaded, independent of Trinitron. Builds the SVG
  // line content and keeps .laser-grid's `top` pinned to .brand's
  // vertical center on resize / font-load. Even if Trinitron fails to
  // initialize, this gives us the page-level vector grid in dark mode.
  function setupLaserGrid() {
    const lg = document.querySelector('.laser-grid');
    if (!lg) return;
    buildGridSvg(lg);

    const brand = document.querySelector('.brand');
    const page  = document.querySelector('.page');
    if (!brand || !page) return;

    function reposition() {
      const brandRect = brand.getBoundingClientRect();
      const pageRect  = page.getBoundingClientRect();
      const brandCenterY = brandRect.top + brandRect.height / 2 - pageRect.top;
      lg.style.top = brandCenterY + 'px';
    }
    reposition();

    // .brand's box can shift independently of the viewport (font load,
    // glyph reflow). Observe it directly so the horizon tracks the
    // wordmark/CTA vertical center even mid-render.
    const obs = new ResizeObserver(reposition);
    obs.observe(brand);

    // Window resize covers viewport-width changes that reshape the
    // whole grid (.page width feeds into the SVG's horizontal scale).
    let t = null;
    window.addEventListener('resize', () => {
      if (t) clearTimeout(t);
      t = setTimeout(reposition, 100);
    });

    // Font load can shift .brand's height after first paint — repos
    // once they've settled.
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(reposition);
    }
  }

  async function init() {
    const canvas = document.querySelector('canvas.hero-screen');
    const brand  = document.querySelector('.brand');
    const mark   = document.querySelector('.mark');
    const wordmark = document.querySelector('.wordmark');
    if (!canvas || !brand || !mark || !wordmark || !window.CRT) return;

    // Wrap each top-level child of .wordmark so all three glyph parts
    // (interslice, ·, systems) have queryable bounding rects. Bare
    // text nodes get a transparent <span>; existing element children
    // just get the marker attribute. CSS inherits into the new spans,
    // so visual layout is unchanged. Done once here so readLayout()
    // can use [data-wordmark-part] as a stable selector.
    for (const node of Array.from(wordmark.childNodes)) {
      if (node.nodeType === Node.TEXT_NODE) {
        if (!node.textContent.trim()) continue;
        const span = document.createElement('span');
        span.dataset.wordmarkPart = '';
        span.textContent = node.textContent;
        wordmark.replaceChild(span, node);
      } else if (node.nodeType === Node.ELEMENT_NODE) {
        node.dataset.wordmarkPart = '';
      }
    }

    let armsImg, hubImg, aquaImg;
    try {
      [armsImg, hubImg, aquaImg] = await Promise.all([
        rasterizeFragment(ARMS_MARKUP),
        rasterizeFragment(HUB_MARKUP),
        rasterizeFragment(AQUA_MARKUP),
      ]);
    } catch (err) {
      return; // Fall back to SVG implementation
    }

    // SVG sprinkles: rasterize each once at startup (markup doesn't
    // change). At paint time we walk this list and draw any that
    // intersect the canvas region, so the sprinkles read as continuous
    // across the screen edge — paper sticker outside, phosphor inside.
    const svgSprinkles = Array.from(document.querySelectorAll('svg.sprinkle'));
    const sprinkleImages = new Map(); // Element → HTMLImageElement
    await Promise.all(svgSprinkles.map(async (spr) => {
      try {
        sprinkleImages.set(spr, await rasterizeSvgElement(spr));
      } catch (_) { /* skip individual failures; sprinkle just doesn't appear in canvas */ }
    }));

    // Wait for Space Grotesk to be loaded — measureText returns metrics
    // for whatever font ctx.font resolves to, so a fallback like
    // system-ui would produce wrong centering. document.fonts.load
    // primes the font cache at one specific size; any other size we
    // use after this resolves the same font face.
    if (document.fonts && document.fonts.load) {
      try {
        await Promise.all([
          document.fonts.load('700 124px "Space Grotesk"'),
          // JetBrains Mono — the .cta-label and .cta-sub captions paint
          // into the CRT using this face. Without priming, the first
          // signal frame measures against a fallback mono and the
          // caption centering drifts on the second frame.
          document.fonts.load('700 11px "JetBrains Mono"'),
        ]);
      } catch (_) { /* fall through; we'll use whatever's available */ }
    }

    // Position the canvas so the halo can extend beyond the .brand
    // bounding box without being clipped at the screen edge.
    canvas.style.top    = `${-HERO_HALO_MARGIN_PX}px`;
    canvas.style.left   = `${-HERO_HALO_MARGIN_PX}px`;
    canvas.style.width  = `calc(100% + ${2 * HERO_HALO_MARGIN_PX}px)`;
    canvas.style.height = `calc(100% + ${2 * HERO_HALO_MARGIN_PX}px)`;

    // Reusable offscreen canvas for the logo composite (resized as the
    // live .mark resizes).
    const logoCanvas = document.createElement('canvas');
    const logoCtx = logoCanvas.getContext('2d');

    let layout = null;
    let trinitron = null;

    // Read live geometry from the DOM. Returns null if any element has
    // zero width/height (e.g. display:none during light-mode).
    function readLayout() {
      const brandRect    = brand.getBoundingClientRect();
      const markRect     = mark.getBoundingClientRect();
      const wordmarkRect = wordmark.getBoundingClientRect();
      if (brandRect.width === 0 || brandRect.height === 0) return null;

      const wmStyle = window.getComputedStyle(wordmark);
      const fontPx = parseFloat(wmStyle.fontSize);
      const lineHeight = parseFloat(wmStyle.lineHeight);
      // CSS line-height < 1 puts the em-box top above the line-box top
      // (the line box is shorter than the em). textBaseline 'top' in
      // canvas anchors to the em-box top; bounding rect anchors to the
      // line-box top. Offset by half the difference so the canvas text
      // sits where the live text sits.
      const emToLineBoxOffset = (fontPx - lineHeight) / 2;

      // Page-relative position of the canvas top-left (in page coords,
      // i.e. document scroll-position-independent — getBoundingClientRect
      // already accounts for scroll). Used to phase-align the dot pattern
      // with the .page::before halftone wash so dots line up continuously
      // across the screen edge. .page is at (0, 0) relative to itself, so
      // brandRect.left is the brand's offset from the page's top-left
      // (the page is the document root layout container).
      const page = document.querySelector('.page');
      const pageRect = page ? page.getBoundingClientRect() : { left: 0, top: 0 };

      // Width/height include the halo margin: the canvas is HALO_MARGIN
      // bigger than .brand on each side. All content x/y inside the
      // source canvas is offset by HALO_MARGIN.
      const M = HERO_HALO_MARGIN_PX;

      // Canvas top-left in viewport coords. Used to map sprinkles'
      // viewport-relative bounding rects into canvas-source coords.
      const canvasVpLeft = brandRect.left - M;
      const canvasVpTop  = brandRect.top  - M;
      const canvasVpRight  = brandRect.right  + M;
      const canvasVpBottom = brandRect.bottom + M;

      // Detect SVG sprinkles whose live bounding rect intersects the
      // canvas region. For each, capture the canvas-coord center, the
      // unrotated CSS dimensions, and the CSS rotation. The signal
      // callback re-draws these on the canvas so the screen edge looks
      // like the sprinkle wraps from paper into phosphor.
      const sprinkles = [];
      for (const spr of svgSprinkles) {
        if (!sprinkleImages.has(spr)) continue;
        const r = spr.getBoundingClientRect();
        if (r.width === 0 || r.height === 0) continue;
        if (r.right  <= canvasVpLeft ||
            r.left   >= canvasVpRight ||
            r.bottom <= canvasVpTop  ||
            r.top    >= canvasVpBottom) continue;

        const sprStyle = window.getComputedStyle(spr);
        let cssW = parseFloat(sprStyle.width);
        let cssH = parseFloat(sprStyle.height);
        if (isNaN(cssW) || cssW === 0) {
          // Fallback: use the rotated AABB dimensions (loses crispness
          // but at least the sprinkle still appears).
          cssW = r.width;
          cssH = r.height;
        } else if (isNaN(cssH) || cssH === 0) {
          // Height is `auto`; derive from the SVG's viewBox aspect.
          const vb = spr.getAttribute('viewBox');
          if (vb) {
            const parts = vb.split(/\s+/).map(parseFloat);
            cssH = parts.length === 4 ? cssW * (parts[3] / parts[2]) : cssW;
          } else {
            cssH = cssW;
          }
        }

        sprinkles.push({
          element: spr,
          centerX: r.left + r.width  / 2 - canvasVpLeft,
          centerY: r.top  + r.height / 2 - canvasVpTop,
          width:  cssW,
          height: cssH,
          rotation: getRotationRad(spr),
        });
      }

      // Wordmark parts — each glyph piece (interslice, ·, systems) is
      // anchored to its own DOM bounding rect, so canvas measureText
      // semantics and CSS layout never disagree about widths or middot
      // positioning. Per-part computed font-weight is captured because
      // the middle <b> overrides the wordmark's default 700 with 500.
      const wordmarkParts = Array.from(wordmark.querySelectorAll('[data-wordmark-part]')).map((el) => {
        const r = el.getBoundingClientRect();
        const st = window.getComputedStyle(el);
        return {
          text: el.textContent,
          x: Math.round(r.left - brandRect.left + M),
          weight: st.fontWeight || '400',
        };
      });

      // Laser grid endpoints in canvas-source coords. setupLaserGrid()
      // pins .laser-grid's `top` to brandCenterY in page coords, and
      // the SVG viewBox maps y=0 → that container top. So viewBox
      // y=0 lives at page y = brandCenterY (the horizon), and
      // viewBox y=GRID_VH at page y = pageRect.height (page bottom).
      // x maps linearly from viewBox 0..GRID_VW to page 0..pageWidth.
      // Subtracting (canvasPageX, canvasPageY) converts page coords
      // to canvas-source coords — same transform the dot-pattern
      // phase uses.
      const canvasPageX = brandRect.left - pageRect.left - M;
      const canvasPageY = brandRect.top  - pageRect.top  - M;
      const brandCenterY      = brandRect.top + brandRect.height / 2 - pageRect.top;
      const gridContainerH    = pageRect.height - brandCenterY;
      const gridXScale        = pageRect.width  / GRID_VW;
      const gridYScale        = gridContainerH  / GRID_VH;
      const gridCanvasOffsetX = -canvasPageX;
      const gridCanvasOffsetY = brandCenterY - canvasPageY;
      const gridLines = GRID_LINES.map((l) => ({
        x1: l.x1 * gridXScale + gridCanvasOffsetX,
        y1: l.y1 * gridYScale + gridCanvasOffsetY,
        x2: l.x2 * gridXScale + gridCanvasOffsetX,
        y2: l.y2 * gridYScale + gridCanvasOffsetY,
        kind: l.kind,
        opacity: l.opacity,
      }));

      return {
        width:  Math.round(brandRect.width  + 2 * M),
        height: Math.round(brandRect.height + 2 * M),
        logoX:    Math.round(markRect.left - brandRect.left + M),
        logoY:    Math.round(markRect.top  - brandRect.top  + M),
        logoSize: Math.round(markRect.width),
        wordmarkX:    Math.round(wordmarkRect.left - brandRect.left + M),
        wordmarkTopY: Math.round(wordmarkRect.top  - brandRect.top  + M - emToLineBoxOffset),
        wordmarkW:    Math.round(wordmarkRect.width),
        wordmarkH:    Math.round(wordmarkRect.height),
        fontPx,
        // Canvas top-left in page coords — used for dot-pattern phase.
        canvasPageX,
        canvasPageY,
        sprinkles,
        gridLines,
        wordmarkParts,
      };
    }

    // ===== SCREEN PAINTER =====
    // Paints the hero screen content onto the signal canvas, assuming the
    // substrate + halftone wash have already been laid down by signal():
    // laser grid, sprinkles, logo, wordmark. (The CTA is not painted here;
    // it lives as live DOM on the cabinet below the screen.)
    function paintScreen(ctx, timeMs) {
      // 1bb. Laser grid — re-paint the page's perspective floor inside
      //      the screen so lines pixelate through the phosphor pipeline
      //      when they cross the canvas edge (same dual-paint trick as
      //      the sprinkles). Source colors are noticeably brighter than
      //      the page-level CSS rgb(0 168 243) to compensate for the
      //      pipeline's cell-sampling + stripe-decomposition + gap-mask
      //      attenuation; both should land at roughly the same on-screen
      //      brightness so the lines read continuous across the edge.
      //      Horizon is drawn after the regular lines so it sits on top
      //      of the near-horizon vertical cluster.
      if (layout.gridLines) {
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = GRID_CRT_COLOR;
        for (const ln of layout.gridLines) {
          if (ln.kind === 'horizon') continue;
          if (ln.opacity < 1) ctx.globalAlpha = ln.opacity;
          ctx.beginPath();
          ctx.moveTo(ln.x1, ln.y1);
          ctx.lineTo(ln.x2, ln.y2);
          ctx.stroke();
          if (ln.opacity < 1) ctx.globalAlpha = 1;
        }
        ctx.lineWidth = 3;
        ctx.strokeStyle = GRID_CRT_HORIZON_COLOR;
        for (const ln of layout.gridLines) {
          if (ln.kind !== 'horizon') continue;
          ctx.beginPath();
          ctx.moveTo(ln.x1, ln.y1);
          ctx.lineTo(ln.x2, ln.y2);
          ctx.stroke();
        }
      }

      // 1c. Sprinkles whose live position intersects the canvas region:
      //     paint the rasterized SVG at the canvas-relative center, with
      //     the same rotation the live element has. The live sprinkle
      //     stays in the DOM at its original page position; outside the
      //     canvas the page paint shows, inside the canvas the substrate
      //     covers the live element and this paint shows in its place —
      //     so the shape reads as continuous across the screen edge.
      for (const spr of layout.sprinkles) {
        const img = sprinkleImages.get(spr.element);
        if (!img) continue;
        ctx.save();
        ctx.translate(spr.centerX, spr.centerY);
        if (spr.rotation) ctx.rotate(spr.rotation);
        ctx.drawImage(img, -spr.width / 2, -spr.height / 2, spr.width, spr.height);
        ctx.restore();
      }

      // 2. Logo — composited in the transparent offscreen canvas
      //    (arms + rotating hub + aqua gloss via source-atop), then
      //    blitted onto the main source canvas at the live logo position.
      logoCtx.clearRect(0, 0, layout.logoSize, layout.logoSize);

      logoCtx.drawImage(armsImg, 0, 0, layout.logoSize, layout.logoSize);

      logoCtx.save();
      const hubC = layout.logoSize / 2;
      logoCtx.translate(hubC, hubC);
      logoCtx.rotate(hubAngleDeg(timeMs) * Math.PI / 180);
      logoCtx.translate(-hubC, -hubC);
      logoCtx.drawImage(hubImg, 0, 0, layout.logoSize, layout.logoSize);
      logoCtx.restore();

      logoCtx.save();
      logoCtx.globalCompositeOperation = 'source-atop';
      logoCtx.drawImage(aquaImg, 0, 0, layout.logoSize, layout.logoSize);
      logoCtx.restore();

      ctx.drawImage(logoCanvas, layout.logoX, layout.logoY);

      // 3. Wordmark — paint each glyph part at its own DOM-anchored x.
      //    The spans were injected at init time so all three parts
      //    (interslice, ·, systems) have queryable bounding rects;
      //    between-parts spacing (including the middot's .wordmark i
      //    margins and letter-spacing: 0 override) comes from CSS for
      //    free. textBaseline 'top' aligns to the em-box top;
      //    wordmarkTopY already includes the em-vs-line-box offset.
      ctx.fillStyle = HERO_WORDMARK_COLOR;
      ctx.textBaseline = 'top';
      const fontPx = layout.fontPx;
      if ('letterSpacing' in ctx) {
        ctx.letterSpacing = (fontPx * HERO_WORDMARK_LETTER_SPACING_EM) + 'px';
      }
      for (const part of layout.wordmarkParts) {
        ctx.font = `${part.weight} ${fontPx}px ${HERO_WORDMARK_FONT}`;
        ctx.fillText(part.text, part.x, layout.wordmarkTopY);
      }
    }

    // Signal callback closure — reads `layout` (outer scope) plus the
    // module-scope phosphor sources (armsImg/hubImg/aquaImg) and
    // logoCanvas. Recreated implicitly each frame; layout is mutated
    // by createTrinitron(), not by the callback.
    function signal(ctx, timeMs) {
      if (!layout) return;

      // 1. Substrate — opaque CRT face under everything. Matches --bg
      //    so the page reads continuously through the screen.
      ctx.fillStyle = HERO_SUBSTRATE;
      ctx.fillRect(0, 0, layout.width, layout.height);

      // 1b. Halftone wash — replicates .page::before inside the screen,
      //     phase-aligned to the page grid so dots are continuous across
      //     the screen edge. Keeps the CRT face from ever looking plain
      //     (it reads as the same paper-tinted glow the page bg has — the
      //     screen content sits *on top* of it).
      const period = HERO_DOT_PERIOD;
      const tc = HERO_DOT_TILE_CENTER;
      const startX = ((tc - layout.canvasPageX) % period + period) % period;
      const startY = ((tc - layout.canvasPageY) % period + period) % period;
      ctx.fillStyle = HERO_DOT_COLOR;
      for (let y = startY; y < layout.height; y += period) {
        for (let x = startX; x < layout.width; x += period) {
          ctx.beginPath();
          ctx.arc(x, y, HERO_DOT_RADIUS, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 2. Screen content — logo, wordmark, laser grid, sprinkles —
      //    painted on top of the substrate + halftone dots.
      paintScreen(ctx, timeMs);
    }

    // Async: CRT.create picks WebGPU (HDR phosphor) on HDR displays, else
    // WebGL2. A newer call (resize mid-build) supersedes an older one; the
    // caller syncs the theme once the engine exists.
    let createGen = 0;
    async function createTrinitron(newLayout) {
      if (!newLayout) return;
      const gen = ++createGen;
      const wasRunning = trinitron && trinitron._wasStartedByUser;
      if (trinitron) {
        try { trinitron.destroy(); } catch (_) { /* defensive */ }
        trinitron = null;
      }
      layout = newLayout;

      // Resize the offscreen logo canvas to match the live mark size.
      logoCanvas.width  = layout.logoSize;
      logoCanvas.height = layout.logoSize;

      try {
        // CRT engine v2 (docs/crt.js). The signal grid is the layout in
        // CSS px (1 signal px = 1 CSS px); the engine sizes its backing
        // store to the canvas's device pixels and draws the aperture
        // grille there — one triad per ~3 CSS px, as v1 did.
        const made = await window.CRT.create(canvas, Object.assign({}, window.CRT.presets.hero, {
          signal,
          signalSize: [layout.width, layout.height],
          triadTarget: Math.max(1, Math.round(layout.width / 3)),
        }));
        if (gen !== createGen) { made.destroy(); return; }
        trinitron = made;
        window.__crt = trinitron;
        if (wasRunning && isDark()) trinitron.start();
      } catch (err) {
        // Silent fallback — SVG dark-mode logo remains as the static fallback.
      }
    }

    function syncWithTheme() {
      if (!trinitron) return;
      if (isDark()) {
        trinitron.start();
        document.documentElement.classList.add('trinitron-active');
      } else {
        trinitron.stop();
        document.documentElement.classList.remove('trinitron-active');
      }
    }

    // Initial creation
    createTrinitron(readLayout()).then(syncWithTheme);

    // Re-sync when OS preference changes
    const colorMq = window.matchMedia('(prefers-color-scheme: dark)');
    const colorHandler = () => syncWithTheme();
    if (colorMq.addEventListener) colorMq.addEventListener('change', colorHandler);
    else if (colorMq.addListener) colorMq.addListener(colorHandler);

    // Re-sync when data-theme changes
    const themeObserver = new MutationObserver(syncWithTheme);
    themeObserver.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['data-theme'],
    });

    // Re-create the renderer when the .brand layout changes (viewport
    // resize, font load, etc.). Debounced — recreating the Trinitron
    // means tearing down and rebuilding the WebGL pipeline, which is
    // ~20 ms; mid-drag we'd hammer it. 200 ms gives a smooth feel.
    let resizeTimer = null;
    const resizeObs = new ResizeObserver(() => {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const newLayout = readLayout();
        if (!newLayout) return;
        // Skip recreation if nothing meaningful changed (sub-pixel
        // float drift can fire ResizeObserver without real layout change).
        if (layout
            && newLayout.width  === layout.width
            && newLayout.height === layout.height
            && newLayout.logoSize === layout.logoSize
            && Math.abs(newLayout.fontPx - layout.fontPx) < 0.5) {
          return;
        }
        createTrinitron(newLayout).then(syncWithTheme);
      }, 200);
    });
    resizeObs.observe(brand);
  }

  function onReady() {
    // setupLaserGrid runs unconditionally — the page-level SVG and
    // its positioning don't depend on Trinitron loading. init() then
    // wires in the in-CRT phosphorization on top.
    setupLaserGrid();
    init();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', onReady);
  } else {
    onReady();
  }
})();
</script>
</body>
</html>
